<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataCost Architect — FinOps Data Architecture Simulator</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#14161a; --muted:#697084; --line:#e3e6ec;
  --accent:#4f6bed; --ok:#1f8a5b; --warn:#b47708; --bad:#c23b4b;
  --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;}
h1,h2,h3{margin:0;font-weight:640;letter-spacing:-0.01em}
code{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:#eef0f5;padding:1px 4px;border-radius:4px}

/* header */
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:14px 22px;background:#101423;color:#fff;}
header .brand h1{font-size:16px}
header .brand p{margin:2px 0 0;font-size:11.5px;color:#9aa3bd;letter-spacing:.04em;text-transform:uppercase}
header .sp{flex:1}
header label{font-size:11.5px;color:#9aa3bd;display:block;margin-bottom:3px;letter-spacing:.03em;text-transform:uppercase}
header select{background:#1c2236;color:#fff;border:1px solid #2c3450;border-radius:7px;padding:6px 9px;font-size:13px}
header button{background:#2c3450;color:#fff;border:0;border-radius:7px;padding:8px 12px;font-size:13px;cursor:pointer}
header button:hover{background:#3a4468}

/* layout */
.wrap{display:flex;align-items:flex-start;gap:0;min-height:calc(100vh - 62px)}
aside{width:330px;flex:0 0 330px;background:var(--panel);border-right:1px solid var(--line);
  padding:16px 16px 60px;height:calc(100vh - 62px);overflow-y:auto;position:sticky;top:0}
main{flex:1;min-width:0;padding:18px 22px 64px}

/* form */
.advbar{display:flex;align-items:center;gap:8px;padding:9px 11px;background:#eef1f8;border:1px solid var(--line);
  border-radius:var(--radius);margin-bottom:14px;font-size:12.5px;color:#3c4460}
.grp{margin-bottom:18px}
.grp h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:10px}
.fld{margin-bottom:9px}
.fld label{display:block;font-size:12px;color:#3c4460;margin-bottom:3px}
.fld .u{color:var(--muted);font-size:11px}
.badge-adv{font-style:normal;font-size:9.5px;background:#e6ebfb;color:#4257b8;border-radius:3px;padding:1px 4px;margin-left:4px;letter-spacing:.04em}
.fld input,.fld select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:7px;
  background:#fff;font-size:13px;color:var(--ink)}
.fld input:focus,.fld select:focus{outline:2px solid #c3cdf7;border-color:var(--accent)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;margin-bottom:7px;cursor:pointer}
.chk input{margin-top:2px}
.chk em{display:block;font-style:normal;font-size:11px;color:var(--muted)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tab{padding:8px 13px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;
  border-radius:6px 6px 0 0}
.tab:hover{background:#eef1f8}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* cards */
.lead{margin-bottom:16px}
.lead h2{font-size:20px;margin:4px 0 4px}
.lead p{margin:0;color:var(--muted);max-width:70ch}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;letter-spacing:.03em}
.pill-star{background:#fdf3d8;color:#8a6408}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;margin-bottom:14px}
.card h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:11px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;display:flex;flex-direction:column;gap:3px}
.k-l{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.k-v{font-size:22px;font-weight:660;letter-spacing:-0.02em}
.k-s{font-size:11.5px;color:var(--muted)}
.sla{font-size:16px;font-weight:700}
.sla.ok{color:var(--ok)} .sla.warn{color:var(--warn)} .sla.bad{color:var(--bad)}
.ok-t{color:var(--ok);font-size:11.5px} .bad-t{color:var(--bad);font-size:11.5px}
.meter{display:block;height:5px;background:#e6e9f0;border-radius:99px;overflow:hidden;margin-top:5px}
.meter span{display:block;height:100%;background:var(--accent)}

/* bars */
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:190px 1fr 132px;align-items:center;gap:10px;font-size:13px}
.bl{color:#3c4460}
.bt{display:block;height:15px;background:#eef0f5;border-radius:4px;overflow:hidden}
.bf{display:block;height:100%;border-radius:4px}
.bv{text-align:right;font-variant-numeric:tabular-nums}
.bv em{font-style:normal;color:var(--muted);font-size:11.5px;margin-left:4px}
.bar.total{border-top:1px solid var(--line);padding-top:7px;font-weight:660}

/* tables */
table.kv{width:100%;border-collapse:collapse;font-size:13px}
table.kv td{padding:5px 0;border-bottom:1px solid #f0f2f6}
table.kv td.r{text-align:right;font-variant-numeric:tabular-nums}
table.cmp{width:100%;border-collapse:collapse;font-size:12.5px}
table.cmp th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
  padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:bottom}
table.cmp td{padding:6px 8px;border-bottom:1px solid #f0f2f6;vertical-align:top}
table.cmp .r{text-align:right;font-variant-numeric:tabular-nums}
table.cmp th.r{text-align:right}
table.cmp .strong{font-weight:660}
table.cmp .src{color:var(--muted);font-size:11.5px}

/* misc */
.wrow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.wchip{font-size:12px;background:#eef1f8;border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.verdict{margin:0;font-size:13.5px;line-height:1.6}
.savebox{background:#eaf6ef;border:1px solid #c6e4d4;border-radius:var(--radius);padding:13px 15px;margin-bottom:14px}
.savebox span{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#2a6a4b}
.savebox b{font-size:24px;color:#186845;display:block;letter-spacing:-0.02em}
.savebox em{font-style:normal;font-size:12px;color:#3f7a5e}
.opt h3{color:var(--ink);text-transform:none;letter-spacing:0;font-size:14.5px}
.why{margin:0 0 11px;color:#4a5165;font-size:13px;max-width:80ch}
.optgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px}
.ms{background:#f7f8fb;border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.ms-l{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.ms-v{font-size:15px;font-weight:640}
.ms.pos .ms-v{color:var(--ok)} .ms.neg .ms-v{color:var(--bad)}
.list{margin:0;padding-left:18px;font-size:13px;color:#3c4460}
.list li{margin-bottom:5px}
.be{margin:0 0 8px;font-size:13.5px}
.chartwrap{width:100%;overflow-x:auto}
.chart{width:100%;min-width:520px;height:300px}
.chart .grid{stroke:#e8eaf0}
.chart .ax{font-size:10px;fill:#8a90a3}
.chart .ax.r{text-anchor:end} .chart .ax.c{text-anchor:middle}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:#4a5165}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}

@media (max-width:980px){
  .wrap{flex-direction:column}
  aside{width:100%;flex:none;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}
  .two{grid-template-columns:1fr}
  .bar{grid-template-columns:130px 1fr 104px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>DataCost Architect</h1>
    <p>FinOps Data Architecture Simulator · MVP mock v0.1</p>
  </div>
  <div class="sp"></div>
  <div>
    <label for="profile">Decision profile</label>
    <select id="profile">
      <option value="cost">Cost Optimized</option>
      <option value="balanced" selected>Balanced</option>
      <option value="performance">Performance Optimized</option>
    </select>
  </div>
  <div>
    <label for="currency">Currency</label>
    <select id="currency">
      <option value="USD" selected>USD</option>
      <option value="BRL">BRL</option>
      <option value="EUR">EUR</option>
    </select>
  </div>
  <button id="reset" type="button">Reset scenario</button>
</header>

<div class="wrap">
  <aside>
    <div class="advbar">
      <input type="checkbox" id="advToggle">
      <label for="advToggle" style="margin:0;cursor:pointer">Show advanced parameters</label>
    </div>
    <div id="form"></div>
  </aside>
  <main>
    <nav class="tabs">
      <div class="tab on" data-tab="result">Result</div>
      <div class="tab" data-tab="compare">Compare scenarios</div>
      <div class="tab" data-tab="optimize">Optimization</div>
      <div class="tab" data-tab="sensitivity">Sensitivity &amp; break-even</div>
      <div class="tab" data-tab="assumptions">Assumptions</div>
    </nav>
    <div id="tabBody"></div>
  </main>
</div>

<script>
/*__ENGINE__*/
</script>
<script>
/*__APP__*/
</script>
</body>
</html>
