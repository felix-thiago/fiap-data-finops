<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataCost Architect — FinOps Data Architecture Simulator</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#14161a; --muted:#697084; --line:#e3e6ec;
  --accent:#4f6bed; --ok:#1f8a5b; --warn:#b47708; --bad:#c23b4b;
  --c-cost:#4f6bed; --c-time:#7a6ff0; --c-teal:#2fa8a0; --c-amber:#e0a32e; --c-rose:#c2586e;
  --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;}
h1,h2,h3{margin:0;font-weight:640;letter-spacing:-0.01em}
code{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:#eef0f5;padding:1px 4px;border-radius:4px}

/* header */
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:14px 22px;background:#101423;color:#fff;}
header .brand h1{font-size:16px}
header .brand p{margin:2px 0 0;font-size:11.5px;color:#9aa3bd;letter-spacing:.04em;text-transform:uppercase}
header .sp{flex:1}
header label{font-size:11.5px;color:#9aa3bd;display:block;margin-bottom:3px;letter-spacing:.03em;text-transform:uppercase}
header select{background:#1c2236;color:#fff;border:1px solid #2c3450;border-radius:7px;padding:6px 9px;font-size:13px}
header button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer}
header button:hover{background:#6580ff}
header .adv{text-transform:none;letter-spacing:0;display:flex;align-items:center;gap:7px;font-size:13px;color:#dfe4f5;cursor:pointer;padding-top:14px}
header .adv input{width:16px;height:16px;accent-color:var(--c-amber)}

/* layout */
main{max-width:1240px;margin:0 auto;padding:0 22px 72px}

/* barra de resumo fixa */
.summary{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 82%,rgba(246,247,249,0));padding:16px 0 10px}
.sgrid{display:grid;grid-template-columns:1.5fr 1fr 1.2fr 1fr;gap:12px}
.scard{border-radius:14px;padding:14px 18px;color:#fff;display:flex;flex-direction:column;gap:2px;box-shadow:0 2px 10px rgba(20,22,26,.10)}
.scard .sl{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;opacity:.85}
.scard .sv{font-size:32px;font-weight:720;letter-spacing:-0.02em;line-height:1.15}
.scard .ss{font-size:12.5px;opacity:.9}
.s-cost{background:linear-gradient(135deg,#4f6bed,#7a6ff0)}
.s-conf{background:linear-gradient(135deg,#2fa8a0,#3c8dbc)}
.s-PASS,.s-GO{background:linear-gradient(135deg,#1f8a5b,#35a873)}
.s-PARTIAL,.s-REVIEW{background:linear-gradient(135deg,#c78a10,#e0a32e)}
.s-FAIL,.s-NO-GO{background:linear-gradient(135deg,#b03047,#d35468)}
.s-NONE{background:linear-gradient(135deg,#697084,#8a91a5)}
.scard .meter{background:rgba(255,255,255,.3);margin-top:7px}.scard .meter span{background:#fff}

/* workload no centro */
.wl-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.wl-head h2{font-size:22px}
.wl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;margin-bottom:22px}
.card.wl{border-top:4px solid var(--gc,var(--accent));margin-bottom:0}
.card.wl h3{color:var(--gc,var(--accent))}
.card.wl .fld input,.card.wl .fld select{padding:8px 10px;font-size:14px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer}
.btn:hover{background:#6580ff}
.gate-box{border-radius:14px;padding:20px 22px;color:#fff;margin-bottom:16px}
.gate-box .gb-t{font-size:13px;letter-spacing:.07em;text-transform:uppercase;opacity:.85}
.gate-box .gb-v{font-size:44px;font-weight:760;letter-spacing:-0.02em;line-height:1.1}
.gate-box p{margin:6px 0 0;max-width:80ch;opacity:.95}
.step{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #f0f2f6}
.step:last-child{border-bottom:0}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.step b{display:block}.step span{color:var(--muted);font-size:13px}
.step .sv2{text-align:right;font-variant-numeric:tabular-nums;font-weight:660}
.step .sv2 em{display:block;font-style:normal;font-weight:400;font-size:12px;color:var(--muted)}

.help{display:block;margin-top:5px;font-size:12px;line-height:1.4;color:var(--muted)}
.help-box{display:none}
.help-box.open{display:block}
.info{display:inline-flex;align-items:center;justify-content:center;width:12px;height:12px;margin-left:4px;padding:0;
  border-radius:50%;border:1px solid var(--accent);background:#fff;color:var(--accent);font:italic 700 8px/1 Georgia,serif;
  cursor:pointer;vertical-align:middle;position:relative}
.info::after{content:"";position:absolute;inset:-5px}
.info:hover{background:var(--accent);color:#fff}
.info:focus-visible{outline:2px solid #c3cdf7}
.help.opt{color:#3a4fb0;background:#eef1fd;border-radius:6px;padding:4px 7px}
.st-info{margin:0 0 11px;font-size:13px;color:#4a5165;background:#f4f6fd;border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:7px 11px}
.scard .bud{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.scard .bud input{width:92px;padding:3px 7px;border-radius:6px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.18);color:#fff;font-size:13.5px;font-weight:650}
.scard .bud input:focus{outline:2px solid #fff;background:rgba(255,255,255,.28)}
/* form */
.advbar{display:flex;align-items:center;gap:8px;padding:9px 11px;background:#eef1f8;border:1px solid var(--line);
  border-radius:var(--radius);margin-bottom:14px;font-size:12.5px;color:#3c4460}
.grp{margin-bottom:18px}
.grp h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:10px}
.fld{margin-bottom:9px}
.fld label{display:block;font-size:12px;color:#3c4460;margin-bottom:3px}
.fld .u{color:var(--muted);font-size:11px}
.badge-adv{font-style:normal;font-size:9.5px;background:#e6ebfb;color:#4257b8;border-radius:3px;padding:1px 4px;margin-left:4px;letter-spacing:.04em}
.fld input,.fld select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:7px;
  background:#fff;font-size:13px;color:var(--ink)}
.fld input:focus,.fld select:focus{outline:2px solid #c3cdf7;border-color:var(--accent)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;margin-bottom:7px;cursor:pointer}
.chk input{margin-top:2px}
.chk em{display:block;font-style:normal;font-size:11px;color:var(--muted)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tab{padding:10px 16px;font-size:14px;font-weight:550;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;
  border-radius:8px 8px 0 0}
.tab:hover{background:#eef1f8}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:680;background:#eef1fd}

/* cards */
.lead{margin-bottom:16px}
.lead h2{font-size:20px;margin:4px 0 4px}
.lead p{margin:0;color:var(--muted);max-width:70ch}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;letter-spacing:.03em}
.pill-star{background:#fdf3d8;color:#8a6408}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;margin-bottom:14px}
.card h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:11px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--kc,var(--accent));border-radius:var(--radius);padding:14px 15px;display:flex;flex-direction:column;gap:3px}
.kpi:nth-child(5n+1){--kc:var(--c-cost)}.kpi:nth-child(5n+2){--kc:var(--c-teal)}.kpi:nth-child(5n+3){--kc:var(--c-amber)}.kpi:nth-child(5n+4){--kc:var(--c-time)}.kpi:nth-child(5n+5){--kc:var(--c-rose)}
.k-l{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.k-v{font-size:28px;font-weight:660;letter-spacing:-0.02em}
.k-s{font-size:11.5px;color:var(--muted)}
.sla{font-size:16px;font-weight:700}
.sla.ok{color:var(--ok)} .sla.warn{color:var(--warn)} .sla.bad{color:var(--bad)}
.ok-t{color:var(--ok);font-size:11.5px} .bad-t{color:var(--bad);font-size:11.5px}
.meter{display:block;height:5px;background:#e6e9f0;border-radius:99px;overflow:hidden;margin-top:5px}
.meter span{display:block;height:100%;background:var(--accent)}

/* bars */
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:190px 1fr 132px;align-items:center;gap:10px;font-size:13px}
.bl{color:#3c4460}
.bt{display:block;height:15px;background:#eef0f5;border-radius:4px;overflow:hidden}
.bf{display:block;height:100%;border-radius:4px}
.bv{text-align:right;font-variant-numeric:tabular-nums}
.bv em{font-style:normal;color:var(--muted);font-size:11.5px;margin-left:4px}
.bar.total{border-top:1px solid var(--line);padding-top:7px;font-weight:660}

/* tables */
table.kv{width:100%;border-collapse:collapse;font-size:13px}
table.kv td{padding:5px 0;border-bottom:1px solid #f0f2f6}
table.kv td.r{text-align:right;font-variant-numeric:tabular-nums}
table.cmp{width:100%;border-collapse:collapse;font-size:12.5px}
table.cmp th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
  padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:bottom}
table.cmp td{padding:6px 8px;border-bottom:1px solid #f0f2f6;vertical-align:top}
table.cmp .r{text-align:right;font-variant-numeric:tabular-nums}
table.cmp th.r{text-align:right}
table.cmp .strong{font-weight:660}
table.cmp .src{color:var(--muted);font-size:11.5px}

/* misc */
.wrow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.wchip{font-size:12px;background:#eef1f8;border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.verdict{margin:0;font-size:13.5px;line-height:1.6}
.savebox{background:#eaf6ef;border:1px solid #c6e4d4;border-radius:var(--radius);padding:13px 15px;margin-bottom:14px}
.savebox span{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#2a6a4b}
.savebox b{font-size:24px;color:#186845;display:block;letter-spacing:-0.02em}
.savebox em{font-style:normal;font-size:12px;color:#3f7a5e}
.opt h3{color:var(--ink);text-transform:none;letter-spacing:0;font-size:14.5px}
.why{margin:0 0 11px;color:#4a5165;font-size:13px;max-width:80ch}
.optgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px}
.ms{background:#f7f8fb;border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.ms-l{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.ms-v{font-size:15px;font-weight:640}
.ms.pos .ms-v{color:var(--ok)} .ms.neg .ms-v{color:var(--bad)}
.list{margin:0;padding-left:18px;font-size:13px;color:#3c4460}
.list li{margin-bottom:5px}
.be{margin:0 0 8px;font-size:13.5px}
.chartwrap{width:100%;overflow-x:auto}
.chart{width:100%;min-width:520px;height:300px}
.chart .grid{stroke:#e8eaf0}
.chart .ax{font-size:10px;fill:#8a90a3}
.chart .ax.r{text-anchor:end} .chart .ax.c{text-anchor:middle}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:#4a5165}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}

/* pipeline flow */
.flow{display:flex;align-items:stretch;gap:6px;overflow-x:auto;padding:4px 0 12px;margin-bottom:6px}
.fl-node{flex:0 0 auto;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:9px 11px;display:flex;flex-direction:column;gap:2px}
.fl-node b{font-size:13px}
.fl-node span{font-size:11px;color:var(--muted)}
.fl-node em{font-style:normal;font-size:11.5px;color:#3c4460}
.fl-node i{font-style:normal;font-size:11px;color:var(--accent)}
.fl-node u{text-decoration:none;font-size:13px;font-weight:660;margin-top:3px}
.fl-arrow{align-self:center;color:#b9c0d2;font-size:17px;flex:0 0 auto}

/* stage editor */
.card.stage{padding:12px 14px}
.card.stage.off{opacity:.55}
.st-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.st-name{font-size:14.5px;font-weight:640;border:1px solid transparent;border-radius:6px;padding:3px 6px;
  background:transparent;color:var(--ink);min-width:170px}
.st-name:hover{border-color:var(--line)}
.st-name:focus{outline:2px solid #c3cdf7;border-color:var(--accent);background:#fff}
.st-kind{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:#4257b8;background:#e6ebfb;
  border-radius:4px;padding:2px 7px}
.st-cost{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.st-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.st-grid .fld{margin-bottom:0}
.st-metrics{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;padding-top:10px;border-top:1px solid #f0f2f6}
.stm{background:#f7f8fb;border:1px solid var(--line);border-radius:7px;padding:5px 9px;display:flex;flex-direction:column}
.stm i{font-style:normal;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.stm b{font-size:13px;font-variant-numeric:tabular-nums}

/* misc v0.2 */
tr.hl{background:#f4f6fd}
.pos-t{color:var(--ok)} .neg-t{color:var(--bad)}
.chart .ax.dim{fill:#b2b8c8}
.mtag{font-size:10px;letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:1px 6px}
.m-api{background:#e4f1e9;color:#1f6a48}
.m-curated{background:#fdf1dc;color:#8a6408}
.m-account{background:#e6ebfb;color:#4257b8}

@media (max-width:980px){
  .sgrid{grid-template-columns:1fr 1fr}
  .summary{position:static}
  .two{grid-template-columns:1fr}
  .bar{grid-template-columns:130px 1fr 104px}
}
</style>
</head>

<header>
  <div class="brand">
    <h1>DataCost Architect</h1>
    <p>FinOps Data Architecture Simulator · MVP mock v0.3 · pipeline por estágios · Go/No-Go</p>
  </div>
  <div class="sp"></div>
  <div>
    <label for="profile">Decision profile</label>
    <select id="profile">
      <option value="cost">Cost Optimized</option>
      <option value="balanced" selected>Balanced</option>
      <option value="performance">Performance Optimized</option>
    </select>
  </div>
  <div>
    <label for="currency">Currency</label>
    <select id="currency">
      <option value="USD" selected>USD</option>
      <option value="BRL">BRL</option>
      <option value="EUR">EUR</option>
    </select>
  </div>
  <label class="adv"><input type="checkbox" id="advToggle"> Advanced parameters</label>
  <button id="reset" type="button">Reset scenario</button>
</header>

<main>
  <div class="summary"><div class="sgrid" id="summary"></div></div>
  <nav class="tabs">
    <div class="tab on" data-tab="pipeline">Workload &amp; pipeline</div>
    <div class="tab" data-tab="result">Result</div>
    <div class="tab" data-tab="gate">Go / No-Go</div>
    <div class="tab" data-tab="schedule">Schedule impact</div>
    <div class="tab" data-tab="compare">Compare scenarios</div>
    <div class="tab" data-tab="optimize">Optimization</div>
    <div class="tab" data-tab="sensitivity">Sensitivity &amp; break-even</div>
    <div class="tab" data-tab="assumptions">Assumptions</div>
  </nav>
  <div id="tabBody"></div>
</main>

<script>
/* =====================================================================
   DataCost Architect — Calculation / Recommendation / Optimization Engine
   v0.2 — modelo por ESTÁGIOS
   ---------------------------------------------------------------------
   Mudanças em relação à v0.1:
   · O pipeline deixou de ser uma etapa única e passou a ser uma lista de
     estágios encadeados (Ingestion → Bronze → Silver → Gold → DW Load →
     Serving). Cada estágio tem engine, tamanho, SCHEDULE PRÓPRIO, formato
     de arquivo, formato de tabela e retenção.
   · File format e table format são dimensões separadas (Iceberg/Delta/Hudi
     sobre Parquet/ORC/Avro), com custo de metadados, snapshots e manutenção.
   · Catálogo aberto de frameworks de ingestão (Glue, EMR/PySpark, Sqoop,
     DMS, Databricks, Snowpipe, framework próprio parametrizável).
   · Varredura de schedule: quanto custa passar de 1x/dia para 1h, 30min…
   Depende de pricing.js (PRICING, price(), FX).
   ===================================================================== */

const DAYS = 30.4;

/* ------------------------------------------------------------------ */
/* 1. CATÁLOGO DE ENGINES                                              */
/* ------------------------------------------------------------------ */
/* kind define o modelo de cobrança:
     glue        → DPU-hora
     ec2         → EC2 on-demand (+ uplift EMR quando emr:true)
     dbx         → DBU (× multiplicador Photon) + EC2 do nó
     dbx_sl      → DBU serverless, sem EC2
     dms         → instância ligada 24×7
     snowflake   → créditos de virtual warehouse
     snowpipe    → créditos serverless por GB carregado
     athena      → TB escaneados
     dbsql       → DBU de SQL warehouse serverless
     custom      → throughput e custo por nó-hora informados pelo usuário  */
const ENGINES = {
  glue:            { label:'AWS Glue (PySpark)',            kind:'glue', gbPerNodeMin:0.45, startupMin:1.5, minBillMin:1, complexity:2, roles:['ingest','transform'] },
  emr_spark:       { label:'PySpark em EMR',                kind:'ec2',  gbPerNodeMin:0.60, startupMin:6.0, minBillMin:1, complexity:4, emr:true, roles:['ingest','transform'] },
  emr_sqoop:       { label:'Sqoop em EMR (JDBC paralelo)',  kind:'ec2',  gbPerNodeMin:0.28, startupMin:6.0, minBillMin:1, complexity:4, emr:true, roles:['ingest'] },
  ec2_spark:       { label:'PySpark em EC2 (self-managed)', kind:'ec2',  gbPerNodeMin:0.58, startupMin:4.0, minBillMin:1, complexity:5, emr:false, roles:['ingest','transform'] },
  dms:             { label:'AWS DMS (CDC contínuo)',        kind:'dms',  gbPerNodeMin:0.50, startupMin:0.0, minBillMin:0, complexity:3, roles:['ingest'] },
  databricks:      { label:'Databricks Jobs (Spark)',       kind:'dbx',  gbPerNodeMin:0.60, startupMin:3.0, minBillMin:1, complexity:3, photon:1, roles:['ingest','transform'] },
  databricks_photon:{label:'Databricks Jobs + Photon',      kind:'dbx',  gbPerNodeMin:0.95, startupMin:3.0, minBillMin:1, complexity:3, photon:2, roles:['ingest','transform'] },
  databricks_sl:   { label:'Databricks Serverless Jobs',    kind:'dbx_sl',gbPerNodeMin:0.95,startupMin:0.5, minBillMin:1, complexity:2, roles:['ingest','transform'] },
  snowflake_wh:    { label:'Snowflake Virtual Warehouse',   kind:'snowflake', startupMin:0.2, complexity:2, roles:['transform','load'] },
  snowpipe:        { label:'Snowpipe (COPY serverless)',    kind:'snowpipe',  startupMin:0.5, complexity:1, roles:['load'] },
  custom_fw:       { label:'Framework próprio (ex.: Talaria)', kind:'custom', startupMin:1.0, minBillMin:1, complexity:3, roles:['ingest','transform'] },
  athena:          { label:'Amazon Athena',                 kind:'athena', complexity:1, roles:['serve'] },
  snowflake_serve: { label:'Snowflake (BI/consumo)',        kind:'snowflake', complexity:2, roles:['serve'] },
  dbsql:           { label:'Databricks SQL Serverless',     kind:'dbsql',  complexity:2, roles:['serve'] },
};

const WORKER_TYPES = {
  'm5.xlarge':  { label:'m5.xlarge (4 vCPU)',  dbu:1.0, ec2:'m5.xlarge',  emrUplift:'emr-uplift-m5.xlarge',  perf:1.0 },
  'm5.2xlarge': { label:'m5.2xlarge (8 vCPU)', dbu:2.0, ec2:'m5.2xlarge', emrUplift:'emr-uplift-m5.2xlarge', perf:2.0 },
  'r5.xlarge':  { label:'r5.xlarge (memória)', dbu:1.2, ec2:'r5.xlarge',  emrUplift:'emr-uplift-m5.xlarge',  perf:1.15 },
};

const WH_SIZES = {
  XS:{ label:'X-Small', credits:1, gbPerMin:1.5 },
  S: { label:'Small',   credits:2, gbPerMin:3.0 },
  M: { label:'Medium',  credits:4, gbPerMin:6.0 },
  L: { label:'Large',   credits:8, gbPerMin:12.0 },
};

/* ------------------------------------------------------------------ */
/* 2. FORMATOS: ARQUIVO × TABELA (dimensões separadas)                 */
/* ------------------------------------------------------------------ */
const FILE_FORMATS = {
  'parquet-zstd':  { label:'Parquet + ZSTD',   ratio:0.18, columnar:true },
  'parquet-snappy':{ label:'Parquet + Snappy', ratio:0.25, columnar:true },
  'orc-zlib':      { label:'ORC + ZLIB',       ratio:0.22, columnar:true },
  'avro-snappy':   { label:'Avro + Snappy',    ratio:0.45, columnar:false },
  'csv-gzip':      { label:'CSV + GZIP',       ratio:0.35, columnar:false },
  'json-none':     { label:'JSON (raw)',       ratio:1.00, columnar:false },
};

/* metaOverhead  → metadados/manifests como fração do dado
   snapshotMult  → multiplicador de storage por versões retidas
   scanFactor    → fração do dado efetivamente lida numa query (pruning)
   maintenance   → exige compaction / expire snapshots
   writeAmp      → sobrecusto de escrita (commit protocol, arquivos extras) */
const TABLE_FORMATS = {
  hive:    { label:'Hive / diretórios', metaOverhead:0.000, snapshotMult:1.00, scanFactor:1.00, maintenance:false, writeAmp:1.00, complexity:1 },
  iceberg: { label:'Apache Iceberg',    metaOverhead:0.020, snapshotMult:1.25, scanFactor:0.60, maintenance:true,  writeAmp:1.08, complexity:3 },
  delta:   { label:'Delta Lake',        metaOverhead:0.020, snapshotMult:1.30, scanFactor:0.65, maintenance:true,  writeAmp:1.10, complexity:3 },
  hudi:    { label:'Apache Hudi (CoW)', metaOverhead:0.040, snapshotMult:1.35, scanFactor:0.70, maintenance:true,  writeAmp:1.25, complexity:4 },
};

const FREQUENCIES = [
  { runsPerDay:1,   label:'Diário' },
  { runsPerDay:2,   label:'A cada 12 h' },
  { runsPerDay:4,   label:'A cada 6 h' },
  { runsPerDay:12,  label:'A cada 2 h' },
  { runsPerDay:24,  label:'A cada 1 h' },
  { runsPerDay:48,  label:'A cada 30 min' },
  { runsPerDay:96,  label:'A cada 15 min' },
  { runsPerDay:288, label:'A cada 5 min' },
];

/* ------------------------------------------------------------------ */
/* 3. CUSTO DE COMPUTE POR ESTÁGIO                                     */
/* ------------------------------------------------------------------ */
function stageRuntimeMin(st, g, volPerRun) {
  const e = ENGINES[st.engine];
  if (e.kind === 'snowflake') {
    const sz = WH_SIZES[st.whSize || 'S'];
    return e.startupMin + volPerRun / sz.gbPerMin;
  }
  if (e.kind === 'snowpipe') return e.startupMin + volPerRun / 4.0;
  if (e.kind === 'custom')   return e.startupMin + volPerRun / (g.customGbPerNodeMin * st.workers);
  if (e.kind === 'dms')      return 0; // contínuo: latência tratada à parte
  const wt = WORKER_TYPES[st.workerType || 'm5.xlarge'];
  return e.startupMin + volPerRun / (e.gbPerNodeMin * wt.perf * st.workers);
}

function stageComputeCost(st, g, volPerRun, runsPerMonth, runtimeMin, retryFactor) {
  const e = ENGINES[st.engine];
  const billedH = Math.max(runtimeMin, e.minBillMin || 0) / 60;
  const wt = WORKER_TYPES[st.workerType || 'm5.xlarge'];
  const nodes = (st.workers || 1) + 1; // + driver/coordenador

  switch (e.kind) {
    case 'glue':
      return nodes * billedH * price('AWS','Glue','etl-dpu') * runsPerMonth * retryFactor;
    case 'ec2': {
      const perNode = price('AWS','EC2', wt.ec2) + (e.emr ? price('AWS','EMR', wt.emrUplift) : 0);
      return nodes * billedH * perNode * runsPerMonth * retryFactor;
    }
    case 'dbx': {
      const perNode = wt.dbu * price('Databricks','Jobs Compute','dbu-jobs-premium') * (e.photon||1)
                    + price('AWS','EC2', wt.ec2);
      return nodes * billedH * perNode * runsPerMonth * retryFactor;
    }
    case 'dbx_sl':
      return nodes * wt.dbu * billedH * price('Databricks','Jobs Compute','dbu-jobs-serverless') * runsPerMonth * retryFactor;
    case 'dms':
      return price('AWS','DMS','dms.c5.large') * 730; // instância 24×7
    case 'snowflake': {
      const sz = WH_SIZES[st.whSize || 'S'];
      const idleH = (st.autoSuspendSec || 0)/3600 * runsPerMonth;
      const credits = (billedH * runsPerMonth + idleH) * sz.credits;
      return credits * price('Snowflake','Warehouse', g.snowflakeEdition==='enterprise'?'credit-enterprise':'credit-standard');
    }
    case 'snowpipe': {
      // ~0,06 crédito por GB carregado (aproximação de referência)
      return volPerRun * runsPerMonth * 0.06 * price('Snowflake','Snowpipe','snowpipe-credit');
    }
    case 'custom':
      return nodes * billedH * g.customCostPerNodeHour * runsPerMonth * retryFactor;
    default:
      return 0;
  }
}

/* ------------------------------------------------------------------ */
/* 4. MOTOR PRINCIPAL — pipeline por estágios                          */
/* ------------------------------------------------------------------ */
function calcPipeline(g, stages) {
  const assumptions = [];
  const A = t => { if (!assumptions.includes(t)) assumptions.push(t); };
  const retryFactor = 1 + (g.failureRate/100) * g.retries;
  if (retryFactor > 1) A(`Retries: multiplicador de ${retryFactor.toFixed(3)}× sobre compute e requests.`);

  const active = stages.filter(s => s.enabled);
  const rows = [];
  let dailyIn = null;

  for (const st of active) {
    const e = ENGINES[st.engine];
    const runsPerDay   = st.runsPerDay;
    const runsPerMonth = runsPerDay * DAYS;

    /* --- volume que ENTRA no estágio --- */
    if (dailyIn === null) {
      if (g.ingestion === 'full') {
        dailyIn = g.sourceVolumeGB * runsPerDay;
        A('Full load: cada execução do primeiro estágio lê o volume total da fonte.');
      } else if (g.ingestion === 'cdc') {
        dailyIn = g.dailyDeltaGB * 1.30;
        A('CDC: +30% sobre o delta diário para before/after image e metadados.');
      } else {
        dailyIn = g.dailyDeltaGB;
      }
    }
    const volPerRun = dailyIn / runsPerDay;

    /* --- tempo e compute (o estágio de consumo é cobrado por query, adiante) --- */
    const runtimeMin = st.kind==='serve' ? 0 : stageRuntimeMin(st, g, volPerRun);
    const compute    = st.kind==='serve' ? 0 : stageComputeCost(st, g, volPerRun, runsPerMonth, runtimeMin, retryFactor);

    /* --- volume que SAI --- */
    const dailyOut = dailyIn * st.reduction;

    /* --- storage da camada produzida --- */
    const ff = FILE_FORMATS[st.fileFormat] || FILE_FORMATS['parquet-snappy'];
    const tf = TABLE_FORMATS[st.tableFormat] || TABLE_FORMATS['hive'];
    let storage = 0, requests = 0, maintenance = 0, storedGB = 0, filesPerRun = 0;

    if (st.kind !== 'serve' && st.kind !== 'load') {
      const dailyWritten = dailyOut * ff.ratio * tf.writeAmp;
      storedGB = dailyWritten * Math.min(st.retentionDays, 3650) * tf.snapshotMult * (1 + tf.metaOverhead);
      if (st.kind === 'ingest' && g.ingestion === 'full') storedGB += g.sourceVolumeGB * ff.ratio;
      const sku = st.storageClass === 'ia' ? 'ia-storage' : st.storageClass === 'glacier' ? 'glacier-ir' : 'standard-storage';
      storage = storedGB * price('AWS','S3', sku);

      filesPerRun = Math.max(1, Math.ceil((dailyOut/runsPerDay * ff.ratio * 1024) / g.targetFileMB));
      const puts = filesPerRun * runsPerMonth * retryFactor * tf.writeAmp;
      const gets = filesPerRun * runsPerMonth * 2;
      requests = (puts/1000)*price('AWS','S3','put-requests') + (gets/1000)*price('AWS','S3','get-requests');

      if (tf.maintenance && st.maintenanceRunsPerMonth > 0) {
        // compaction/expire processa a fatia "quente" da camada
        const activeGB = storedGB * 0.10;
        const mtRuntime = stageRuntimeMin({...st, engine: e.roles.includes('transform')? st.engine : 'glue'}, g, activeGB);
        maintenance = stageComputeCost(st, g, activeGB, st.maintenanceRunsPerMonth, mtRuntime, 1);
        A(`${tf.label}: manutenção (compaction/expire snapshots) cobrada ${st.maintenanceRunsPerMonth}×/mês na camada ${st.name}.`);
      }
      if (tf.snapshotMult > 1) A(`${tf.label}: storage multiplicado por ${tf.snapshotMult}× devido a snapshots retidos.`);
    }

    /* --- estágio de carga no DW: storage do warehouse --- */
    let whStorage = 0;
    if (st.kind === 'load' && g.dwStorage) {
      const prevOut = dailyOut * (FILE_FORMATS[st.fileFormat]||FILE_FORMATS['parquet-snappy']).ratio;
      storedGB = prevOut * Math.min(st.retentionDays, 3650);
      whStorage = (storedGB/1024) * price('Snowflake','Storage', g.snowflakeStorage==='ondemand'?'ondemand-storage':'capacity-storage');
    }

    /* --- estágio de consumo --- */
    let serveCost = 0, serveDetail = '';
    if (st.kind === 'serve') {
      const tfPrev = TABLE_FORMATS[st.tableFormat] || TABLE_FORMATS['hive'];
      if (e.kind === 'athena') {
        const scannedTB = (g.queriesPerDay * DAYS * g.scanPerQueryGB * tfPrev.scanFactor) / 1024;
        serveCost = scannedTB * price('AWS','Athena','data-scanned');
        serveDetail = `${scannedTB.toFixed(2)} TB escaneados/mês (scan factor ${tfPrev.scanFactor})`;
        if (tfPrev.scanFactor < 1) A(`${tfPrev.label}: partition/file pruning reduz o volume escaneado para ${(tfPrev.scanFactor*100).toFixed(0)}%.`);
      } else if (e.kind === 'snowflake') {
        const sz = WH_SIZES[st.whSize || 'S'];
        const queryH = g.queriesPerDay * DAYS * g.avgQuerySec / 3600;
        const idleH  = (st.autoSuspendSec||0)/3600 * g.queriesPerDay * DAYS / 20; // agrupa queries em sessões
        const credits = (queryH + idleH) * sz.credits;
        serveCost = credits * price('Snowflake','Warehouse', g.snowflakeEdition==='enterprise'?'credit-enterprise':'credit-standard');
        serveDetail = `${credits.toFixed(1)} créditos/mês (warehouse ${st.whSize})`;
      } else if (e.kind === 'dbsql') {
        const queryH = g.queriesPerDay * DAYS * g.avgQuerySec / 3600;
        const dbu = queryH * 4;
        serveCost = dbu * price('Databricks','SQL Warehouse','dbu-sql-serverless');
        serveDetail = `${dbu.toFixed(1)} DBU/mês em SQL Serverless`;
      }
    }

    rows.push({
      stage: st, engineLabel: e.label,
      runsPerDay, runsPerMonth, volPerRun, dailyIn, dailyOut,
      runtimeMin, intervalMin: 1440/runsPerDay,
      filesPerRun, storedGB,
      cost: { compute, storage: storage + whStorage, requests, maintenance, serve: serveCost },
      total: compute + storage + whStorage + requests + maintenance + serveCost,
      serveDetail,
    });

    dailyIn = dailyOut;
  }

  /* --- rede --- */
  const network = g.crossRegionGB * price('AWS','Network','cross-region-out')
                + g.internetGB    * price('AWS','Network','internet-out');

  /* --- catálogo Glue --- */
  const catalog = (g.catalogObjects/100000) * price('AWS','Glue','catalog-objects');

  /* --- totais --- */
  const disc = 1 - g.discountPct/100;
  const breakdown = { Ingestion:0, Storage:0, Processing:0, Warehouse:0, Maintenance:0, Network:network, Catalog:catalog };
  rows.forEach(r => {
    breakdown.Storage    += r.cost.storage + r.cost.requests;
    breakdown.Maintenance+= r.cost.maintenance;
    if (r.stage.kind === 'ingest')      breakdown.Ingestion  += r.cost.compute;
    else if (r.stage.kind === 'transform') breakdown.Processing += r.cost.compute;
    else                                breakdown.Warehouse  += r.cost.compute + r.cost.serve;
  });
  Object.keys(breakdown).forEach(k => breakdown[k] *= disc);
  rows.forEach(r => r.totalDisc = r.total * disc);
  const monthly = Object.values(breakdown).reduce((a,b)=>a+b,0);
  if (g.discountPct>0) A(`Desconto contratual de ${g.discountPct}% aplicado sobre o preço de lista.`);

  /* --- tempo, SLA e freshness --- */
  const batchRows = rows.filter(r => r.stage.kind !== 'serve');
  const processingMin = batchRows.reduce((a,r)=>a + r.runtimeMin, 0);
  const latencyMin = g.orchestration === 'independent'
    ? batchRows.reduce((a,r)=>a + r.intervalMin + r.runtimeMin, 0)
    : Math.max(0, ...batchRows.map(r=>r.intervalMin)) + processingMin;
  const slaTimeOk   = processingMin <= g.slaMaxMinutes;
  const freshnessOk = latencyMin <= g.freshnessHours*60;
  const slaStatus = slaTimeOk && freshnessOk ? 'PASS' : (slaTimeOk||freshnessOk ? 'PARTIAL' : 'FAIL');
  A(g.orchestration === 'independent'
    ? 'Estágios agendados de forma independente: latência = Σ (intervalo + tempo de execução) de cada estágio.'
    : 'Estágios encadeados numa única DAG: latência = maior intervalo de agendamento + soma dos tempos de execução.');

  /* --- volumes agregados --- */
  const firstRow = rows[0];
  const monthlyRawGB = firstRow ? firstRow.dailyIn * DAYS : 0;
  const totalStoredGB = rows.reduce((a,r)=>a+r.storedGB,0);

  /* --- confidence --- */
  let conf = 50;
  const prov = g._provided || {};
  const advKeys = ['retentionDays','targetFileMB','failureRate','retries','crossRegionGB','queriesPerDay',
                   'discountPct','recordsPerDay','catalogObjects','scanPerQueryGB','avgQuerySec'];
  conf += advKeys.filter(k=>prov[k]).length * 2.5;
  conf += Math.min(12, active.length * 2);              // pipeline detalhado por estágio
  if (active.some(s => ENGINES[s.engine].kind==='custom')) conf -= 8;
  if (g.failureRate > 5) conf -= 5;
  if (g.ingestion === 'cdc') conf -= 3;
  conf = Math.max(35, Math.min(92, Math.round(conf)));
  const spread = (100-conf)/100 * 0.9;

  /* --- unit economics --- */
  const tbProcessed = monthlyRawGB/1024;
  const unit = {
    perMonth: monthly, perYear: monthly*12,
    perTB: tbProcessed>0 ? monthly/tbProcessed : 0,
    perGBIngested: monthlyRawGB>0 ? monthly/monthlyRawGB : 0,
    perGBStored: totalStoredGB>0 ? monthly/totalStoredGB : 0,
    perMillionRec: g.recordsPerDay>0 ? monthly/((g.recordsPerDay*DAYS)/1e6) : 0,
    perQuery: g.queriesPerDay>0 ? monthly/(g.queriesPerDay*DAYS) : 0,
    perRunSet: monthly / Math.max(1, rows.reduce((a,r)=>a+r.runsPerMonth,0)),
  };

  return {
    rows, breakdown, monthly, range:{low:monthly*(1-spread), high:monthly*(1+spread)},
    confidence:conf, processingMin, latencyMin, slaStatus, slaTimeOk, freshnessOk,
    monthlyRawGB, totalStoredGB, tbProcessed, unit, assumptions,
    complexity: rows.reduce((a,r)=>a+ENGINES[r.stage.engine].complexity + (TABLE_FORMATS[r.stage.tableFormat]?.complexity||0), 0),
  };
}

/* ------------------------------------------------------------------ */
/* 5. VARREDURA DE SCHEDULE                                            */
/* ------------------------------------------------------------------ */
/** Aplica cada frequência do catálogo a todos os estágios (ou só aos
 *  estágios marcados em `scope`) e devolve custo, latência e SLA. */
function scheduleSweep(g, stages, scope = null) {
  return FREQUENCIES.map(f => {
    const st = stages.map(s => {
      const inScope = !scope || scope.includes(s.key);
      return inScope ? { ...s, runsPerDay: f.runsPerDay } : s;
    });
    const r = calcPipeline(g, st);
    const perStage = {};
    r.rows.forEach(row => perStage[row.stage.key] = row.totalDisc);
    return {
      runsPerDay:f.runsPerDay, label:f.label, monthly:r.monthly,
      latencyMin:r.latencyMin, processingMin:r.processingMin, slaStatus:r.slaStatus,
      perStage,
    };
  });
}

/* ------------------------------------------------------------------ */
/* 6. VARIANTES DE ARQUITETURA (comparação)                            */
/* ------------------------------------------------------------------ */
const swapTransforms = (stages, engine) =>
  stages.map(s => s.kind==='transform' && ENGINES[engine].roles.includes('transform') ? {...s, engine} : s);

const VARIANTS = {
  asis: {
    id:'asis', name:'As-is (configuração atual)',
    note:'O pipeline exatamente como está configurado na aba Pipeline.',
    apply: (g,s) => [g, s],
  },
  dbx: {
    id:'dbx', name:'Databricks Photon nas transformações',
    note:'Bronze/Silver/Gold migrados para Databricks Jobs com Photon; ingestão e DW inalterados.',
    apply: (g,s) => [g, swapTransforms(s,'databricks_photon')],
  },
  emr: {
    id:'emr', name:'PySpark em EMR',
    note:'Transformações em cluster EMR próprio (EC2 + uplift EMR), maior complexidade operacional.',
    apply: (g,s) => [g, swapTransforms(s,'emr_spark')],
  },
  lake: {
    id:'lake', name:'Servir do lake (Athena), sem DW',
    note:'Remove a carga no Snowflake; o consumo passa a ler a camada Gold direto no S3 via Athena.',
    apply: (g,s) => [g, s.filter(x=>x.kind!=='load').map(x => x.kind==='serve' ? {...x, engine:'athena'} : x)],
  },
  elt: {
    id:'elt', name:'ELT dentro do Snowflake',
    note:'Ingestão para o S3, carga bruta via Snowpipe e transformações Silver/Gold executadas em virtual warehouse.',
    apply: (g,s) => [g, s.map(x => {
      if (x.kind==='transform' && x.key!=='bronze') return {...x, engine:'snowflake_wh', whSize:'M'};
      if (x.kind==='load') return {...x, engine:'snowpipe'};
      return x;
    })],
  },
};

const PROFILES = {
  cost:        { label:'Cost Optimized',        w:{cost:.55, sla:.20, perf:.15, scale:.05, cx:.05} },
  balanced:    { label:'Balanced',              w:{cost:.40, sla:.25, perf:.20, scale:.10, cx:.05} },
  performance: { label:'Performance Optimized', w:{cost:.20, sla:.35, perf:.30, scale:.10, cx:.05} },
};

function scoreVariants(results, weights) {
  const norm = (v, mn, mx) => mx===mn ? 1 : 1-(v-mn)/(mx-mn);
  const costs = results.map(r=>r.monthly), times = results.map(r=>r.processingMin), cxs = results.map(r=>r.complexity);
  const [minC,maxC]=[Math.min(...costs),Math.max(...costs)];
  const [minT,maxT]=[Math.min(...times),Math.max(...times)];
  const [minX,maxX]=[Math.min(...cxs),Math.max(...cxs)];
  return results.map(r => {
    const sCost=norm(r.monthly,minC,maxC), sPerf=norm(r.processingMin,minT,maxT), sCx=norm(r.complexity,minX,maxX);
    const sSla = r.slaStatus==='PASS'?1:r.slaStatus==='PARTIAL'?0.5:0;
    const sScale = r.rows.some(x=>ENGINES[x.stage.engine].kind==='dbx'||ENGINES[x.stage.engine].kind==='dbx_sl') ? 1 : 0.8;
    const total = weights.cost*sCost + weights.sla*sSla + weights.perf*sPerf + weights.scale*sScale + weights.cx*sCx;
    return {...r, score: total*100};
  }).sort((a,b)=>b.score-a.score);
}

/* ------------------------------------------------------------------ */
/* 7. OTIMIZAÇÕES                                                      */
/* ------------------------------------------------------------------ */
const OPT_RULES = [
  { id:'full-to-incremental', title:'Migrar de Full Load para Incremental',
    why:'O delta diário é uma fração pequena da base; reprocessar tudo a cada execução multiplica compute, escrita e storage.',
    applies:(g)=> g.ingestion==='full' && g.dailyDeltaGB < g.sourceVolumeGB*0.25,
    patch:(g,s)=>[{...g, ingestion:'incremental'}, s] },

  { id:'columnar-raw', title:'Adotar Parquet + ZSTD nas camadas em CSV/JSON',
    why:'Formato colunar comprimido reduz storage, requests e o volume lido pelos estágios seguintes.',
    applies:(g,s)=> s.some(x=>x.enabled && ['csv-gzip','json-none','avro-snappy'].includes(x.fileFormat)),
    patch:(g,s)=>[g, s.map(x=> ['csv-gzip','json-none','avro-snappy'].includes(x.fileFormat) ? {...x, fileFormat:'parquet-zstd'} : x)] },

  { id:'table-format-gold', title:'Adotar Iceberg na camada consumida',
    why:'Partition e file pruning reduzem o volume escaneado por consulta; o custo extra de metadados costuma ser menor que a economia de scan.',
    applies:(g,s)=> s.some(x=>x.enabled&&x.kind==='serve'&&ENGINES[x.engine].kind==='athena')
                 && s.some(x=>x.enabled&&x.key==='gold'&&x.tableFormat==='hive'),
    patch:(g,s)=>[g, s.map(x=> (x.key==='gold'||x.kind==='serve') ? {...x, tableFormat:'iceberg', maintenanceRunsPerMonth: x.kind==='serve'?0:30} : x)] },

  { id:'raw-lifecycle', title:'Mover a camada bruta para S3 Standard-IA',
    why:'A camada bruta com retenção longa é lida raramente depois de processada — candidata natural a classe de armazenamento mais barata.',
    applies:(g,s)=> s.some(x=>x.enabled&&x.kind==='ingest'&&x.storageClass==='standard'&&x.retentionDays>=180),
    patch:(g,s)=>[g, s.map(x=> x.kind==='ingest' ? {...x, storageClass:'ia'} : x)] },

  { id:'raw-retention', title:'Reduzir a retenção da camada bruta para 90 dias',
    why:'Com Silver e Gold versionadas, manter a bruta por mais de um ano raramente atende a um requisito real de negócio ou compliance.',
    applies:(g,s)=> s.some(x=>x.enabled&&x.kind==='ingest'&&x.retentionDays>180),
    patch:(g,s)=>[g, s.map(x=> x.kind==='ingest' ? {...x, retentionDays:90} : x)] },

  { id:'file-compaction', title:'Compactar arquivos para ~128 MB',
    why:'Muitos arquivos pequenos elevam o custo de requests e o overhead de planejamento das engines.',
    applies:(g)=> g.targetFileMB < 64,
    patch:(g,s)=>[{...g, targetFileMB:128}, s] },

  { id:'downscale-schedule', title:'Reduzir a frequência dos estágios com folga de freshness',
    why:'Há folga entre a latência atual e o requisito de freshness; executar menos vezes reduz startups e mínimos de cobrança.',
    applies:(g,s,base)=> base && base.latencyMin < g.freshnessHours*60*0.45 && s.some(x=>x.enabled&&x.runsPerDay>1),
    patch:(g,s)=>[g, s.map(x=> x.runsPerDay>1 ? {...x, runsPerDay: Math.max(1, Math.round(x.runsPerDay/2))} : x)] },

  { id:'wh-autosuspend', title:'Reduzir auto-suspend do warehouse para 60 s',
    why:'Warehouse suspenso não consome créditos; janelas de ociosidade longas são cobradas a cada execução ou sessão.',
    applies:(g,s)=> s.some(x=>x.enabled&&ENGINES[x.engine].kind==='snowflake'&&(x.autoSuspendSec||0)>120),
    patch:(g,s)=>[g, s.map(x=> ENGINES[x.engine].kind==='snowflake' ? {...x, autoSuspendSec:60} : x)] },

  { id:'wh-rightsize', title:'Reduzir o tamanho do virtual warehouse',
    why:'O tempo total de processamento está bem abaixo do SLA; um warehouse menor mantém o SLA a metade do custo em créditos.',
    applies:(g,s,base)=> base && base.processingMin < g.slaMaxMinutes*0.5
                      && s.some(x=>x.enabled&&ENGINES[x.engine].kind==='snowflake'&&['M','L'].includes(x.whSize)),
    patch:(g,s)=>[g, s.map(x=> ENGINES[x.engine].kind==='snowflake' && ['M','L'].includes(x.whSize)
                      ? {...x, whSize: x.whSize==='L'?'M':'S'} : x)] },
];

function findOptimizations(g, stages, base) {
  const out = [];
  for (const rule of OPT_RULES) {
    if (!rule.applies(g, stages, base)) continue;
    const [ng, ns] = rule.patch(g, stages);
    const after = calcPipeline(ng, ns);
    const saving = base.monthly - after.monthly;
    if (saving <= base.monthly*0.01) continue;
    out.push({ ...rule, saving, savingPct: saving/base.monthly*100, newMonthly: after.monthly,
               slaBefore: base.slaStatus, slaAfter: after.slaStatus,
               latBefore: base.latencyMin, latAfter: after.latencyMin });
  }
  return out.sort((a,b)=>b.saving-a.saving);
}

/* ------------------------------------------------------------------ */
/* 8. SENSIBILIDADE E BREAK-EVEN                                       */
/* ------------------------------------------------------------------ */
const SENS_MULTIPLIERS = [0.25, 0.5, 1, 2, 4, 8, 16];
const scaleG = (g,m) => ({...g,
  sourceVolumeGB:g.sourceVolumeGB*m, dailyDeltaGB:g.dailyDeltaGB*m,
  recordsPerDay:g.recordsPerDay*m, scanPerQueryGB:g.scanPerQueryGB*m });

function sensitivity(g, stages, variantIds) {
  return SENS_MULTIPLIERS.map(m => {
    const sg = scaleG(g,m);
    const row = { multiplier:m, tb:0, costs:{} };
    variantIds.forEach(id => {
      const [vg, vs] = VARIANTS[id].apply(sg, stages);
      const r = calcPipeline(vg, vs);
      row.costs[id] = r.monthly;
      if (!row.tb) row.tb = r.tbProcessed;
    });
    return row;
  });
}

function breakEven(g, stages, variantIds) {
  const steps=60, lo=Math.log10(0.1), hi=Math.log10(30);
  let prev=null; const out=[];
  for (let s=0;s<=steps;s++){
    const m = Math.pow(10, lo+(hi-lo)*s/steps);
    const sg = scaleG(g,m);
    let best=null, tb=0;
    variantIds.forEach(id=>{
      const [vg,vs]=VARIANTS[id].apply(sg,stages);
      const r=calcPipeline(vg,vs);
      tb = r.tbProcessed;
      if(!best||r.monthly<best.cost) best={id,cost:r.monthly};
    });
    if (prev && best.id!==prev.id) out.push({multiplier:m, tb, from:prev.id, to:best.id});
    prev=best;
  }
  return out;
}

/* ------------------------------------------------------------------ */
/* 9. GO / NO-GO DE ORÇAMENTO                                          */
/* ------------------------------------------------------------------ */
/** GO: limite superior da faixa cabe no orçamento. REVIEW: o valor central
 *  cabe, mas o limite superior estoura. NO-GO: o valor central já estoura. */
function budgetGate(monthly, range, budget) {
  if (!(budget > 0)) return { status: 'NONE', budget: 0, monthly, headroom: 0, usedPct: 0 };
  const status = monthly > budget ? 'NO-GO' : range.high > budget ? 'REVIEW' : 'GO';
  return { status, budget, monthly, headroom: budget - monthly, usedPct: monthly / budget * 100 };
}

/** Aplica, uma a uma, a regra de otimização de maior economia até o custo
 *  caber no orçamento (recalculando o pipeline a cada passo). */
function gateSuggestions(g, stages, budget, maxSteps = 6) {
  let cg = g, cs = stages, cur = calcPipeline(cg, cs);
  const steps = [], used = new Set();
  while (cur.monthly > budget && steps.length < maxSteps) {
    const cands = OPT_RULES.filter(r => !used.has(r.id) && r.applies(cg, cs, cur)).map(r => {
      const [ng, ns] = r.patch(cg, cs); const a = calcPipeline(ng, ns);
      return { r, ng, ns, a, saving: cur.monthly - a.monthly };
    }).filter(c => c.saving > cur.monthly * 0.01).sort((x, y) => y.saving - x.saving);
    if (!cands.length) break;
    const c = cands[0]; used.add(c.r.id);
    steps.push({ id: c.r.id, title: c.r.title, why: c.r.why, saving: c.saving, newMonthly: c.a.monthly, slaAfter: c.a.slaStatus });
    cg = c.ng; cs = c.ns; cur = c.a;
  }
  return { steps, finalMonthly: cur.monthly, reachable: cur.monthly <= budget, finalSla: cur.slaStatus };
}

</script>

function workloadPanel() {
  const root = el('div');
  root.appendChild(el('div','wl-head','<h2>Workload</h2>'));
  const grid = el('div','wl-grid');
  G_GROUPS.forEach((g,i) => {
    const keys = g.keys.filter(k => SHOW_ADV || !G_FIELDS.find(x=>x[0]===k)[4]);
    if (!keys.length) return;
    const card = el('section','card wl'); card.style.setProperty('--gc', SERIES[i%SERIES.length]);
    card.appendChild(el('h3',null,g.title));
    keys.forEach(k => card.appendChild(gField(G_FIELDS.find(x=>x[0]===k))));
    grid.appendChild(card);
  });
  root.appendChild(grid);
  return root;
}

function gField(def) {
  const [key,label,type,opts,adv,unit] = def;
  const w = el('div','fld');
  w.appendChild(el('label',null,label + (unit?` <span class="u">${unit}</span>`:'') + (adv?' <i class="badge-adv">adv</i>':'')));
  if (type==='select') {
    const s = el('select');
    opts.forEach(o=>{ const [v,t]=Array.isArray(o)?o:[o,o]; const op=el('option',null,t); op.value=v;
      if(String(G[key])===String(v)) op.selected=true; s.appendChild(op); });
    s.onchange = () => { const v=s.value; G[key] = typeof G_DEFAULTS[key]==='number'? +v : v; G._provided[key]=1; render(); };
    w.appendChild(s);
  } else {
    const i = el('input'); i.type=type; i.value=G[key];
    i.oninput = () => { G[key] = type==='number' ? (+i.value||0) : i.value; G._provided[key]=1; render(false); };
    w.appendChild(i);
  }
  return w;
}

  head.appendChild(cb);
  const nm = el('input','st-name'); nm.value=st.name;
  nm.oninput = () => { st.name=nm.value; render(false); };
  head.appendChild(nm);
  head.appendChild(el('span','st-kind', st.kind));
  if (row) head.appendChild(el('span','st-cost', money(row.totalDisc,0)+'/mês · '+mins(row.runtimeMin)));
  c.appendChild(head);

  HELP_SCOPE = st.key;
  const info = STAGE_INFO[st.key] || KIND_INFO[st.kind] || '';
  const ibox = el('p','st-info help-box' + (OPEN_HELP.has(st.key+':layer') ? ' open' : ''), info);

  c.appendChild(ibox);

  const grid = el('div','st-grid');

  grid.appendChild(sel('Engine / framework',
    Object.entries(ENGINES).filter(([,e])=>e.roles.includes(st.kind)).map(([k,e])=>[k,e.label]),
    st.engine, v => { st.engine=v; render(); }, 'engine'));

  if (['glue','ec2','dbx','dbx_sl','custom'].includes(eng.kind)) {
    grid.appendChild(inp('Workers','number',st.workers,'nodes', v => { st.workers=Math.max(1,+v||1); render(false); }, 'workers'));
    grid.appendChild(sel('Worker type', Object.entries(WORKER_TYPES).map(([k,w])=>[k,w.label]), st.workerType, v=>{st.workerType=v;render();}, 'workerType'));
  }
  if (eng.kind==='snowflake') {
    grid.appendChild(sel('Warehouse size', Object.entries(WH_SIZES).map(([k,w])=>[k,w.label]), st.whSize, v=>{st.whSize=v;render();}, 'whSize'));
    grid.appendChild(inp('Auto-suspend','number',st.autoSuspendSec,'s', v=>{st.autoSuspendSec=+v||0;render(false);}, 'autoSuspend'));
  }
  if (st.kind!=='serve') {
    grid.appendChild(sel('Schedule', FREQUENCIES.map(f=>[f.runsPerDay,f.label]), st.runsPerDay, v=>{st.runsPerDay=+v;render();}, 'schedule'));
    grid.appendChild(inp('Volume reduction','number',st.reduction,'out/in', v=>{st.reduction=Math.max(0.01,+v||0.01);render(false);}, 'reduction'));
  }
  if (st.kind!=='serve' && st.kind!=='load') {
    grid.appendChild(sel('File format', Object.entries(FILE_FORMATS).map(([k,f])=>[k,f.label]), st.fileFormat, v=>{st.fileFormat=v;render();}, 'fileFormat'));
    grid.appendChild(sel('Table format', Object.entries(TABLE_FORMATS).map(([k,f])=>[k,f.label]), st.tableFormat, v=>{st.tableFormat=v;render();}, 'tableFormat'));
    grid.appendChild(inp('Retention','number',st.retentionDays,'days', v=>{st.retentionDays=+v||0;render(false);}, 'retention'));

    if (TABLE_FORMATS[st.tableFormat].maintenance)
      grid.appendChild(inp('Maintenance runs','number',st.maintenanceRunsPerMonth,'per month', v=>{st.maintenanceRunsPerMonth=+v||0;render(false);}, 'maintenance'));
  }

    grid.appendChild(inp('DW retention','number',st.retentionDays,'days', v=>{st.retentionDays=+v||0;render(false);}, 'dwRetention'));
  }

    grid.appendChild(sel('Table format read', Object.entries(TABLE_FORMATS).map(([k,f])=>[k,f.label]), st.tableFormat, v=>{st.tableFormat=v;render();}, 'tableFormat', 'tableRead'));

  if (row) {
    const d = el('div','st-metrics');

     ['Runtime', mins(row.runtimeMin)],
     ['Execuções/mês', num(row.runsPerMonth,0)],

    ].forEach(([l,v]) => d.appendChild(el('span','stm',`<i>${l}</i><b>${v}</b>`)));
    c.appendChild(d);
    if (row.serveDetail) c.appendChild(el('p','note',row.serveDetail));

  return c;
}

const OPEN_HELP = new Set();
let HELP_SCOPE = '';

function infoBtn(id, box) {
  const b = el('button','info','i'); b.type = 'button'; b.title = 'O que é isto?'; b.setAttribute('aria-label','Descrição');
  b.onclick = e => {
    e.preventDefault(); e.stopPropagation();
    const open = box.classList.toggle('open');
    open ? OPEN_HELP.add(id) : OPEN_HELP.delete(id);
  };
  return b;
}
function helpBox(id, lines) {
  const box = el('div','help-box' + (OPEN_HELP.has(id) ? ' open' : ''));
  lines.filter(Boolean).forEach((t,i) => box.appendChild(el('small', 'help' + (i ? ' opt' : ''), t)));
  return box;
}
function withHelp(w, labelEl, key, lines) {
  const texts = lines.filter(Boolean);
  if (!texts.length) return;
  const id = HELP_SCOPE + ':' + key;
  const box = helpBox(id, texts);
  labelEl.appendChild(infoBtn(id, box));
  w.appendChild(box);
}

function sel(label, options, value, onchange, key, fieldKey) {
  const w = el('div','fld'); const lb = el('label',null,label); w.appendChild(lb);
  const s = el('select');
  options.forEach(([v,t])=>{ const o=el('option',null,t); o.value=v; if(String(value)===String(v))o.selected=true; s.appendChild(o); });
  s.onchange = () => onchange(s.value);
  w.appendChild(s);
  if (key) withHelp(w, lb, key, [helpFor(fieldKey || key), optHelp(key, value)]);
  return w;
}
function inp(label,type,value,unit,onchange,key) {
  const w = el('div','fld'); const lb = el('label',null,label+(unit?` <span class="u">${unit}</span>`:'')); w.appendChild(lb);
  const i = el('input'); i.type=type; i.value=value; i.step='any';
  i.oninput = () => onchange(i.value);
  w.appendChild(i);
  if (key) withHelp(w, lb, key, [helpFor(key)]);
  return w;
}

const GATE_TEXT = {
  'GO':     'O limite superior da estimativa cabe no orçamento. Pode executar.',

  'NO-GO':  'O custo estimado estoura o orçamento. O pipeline não deve ser disparado sem ajustes.',
  'NONE':   'Defina um orçamento mensal no card “SLA, freshness & budget” para ativar o Go/No-Go.',
};
const gateNow = () => { const r = base(); return { r, gate: budgetGate(r.monthly, r.range, G.budgetMonthly) }; };

function viewGate() {
  const { r, gate } = gateNow(); const root = el('div');
  root.appendChild(el('div','lead','<h2>Go / No-Go de orçamento</h2><p>O custo estimado antes da execução é comparado ao orçamento. Se estourar, o motor aplica as otimizações de maior economia, uma a uma, até caber.</p>'));
  const box = el('div','gate-box s-'+gate.status);
  box.innerHTML = `<div class="gb-t">Veredito</div><div class="gb-v">${gate.status==='NONE'?'—':gate.status}</div><p>${GATE_TEXT[gate.status]}</p>`;
  root.appendChild(box);

  const k = el('div','kpis');
  k.appendChild(kpi('Custo estimado', money(r.monthly,0), `faixa ${money(r.range.low,0)} – ${money(r.range.high,0)}`));
  k.appendChild(kpi('Orçamento mensal', gate.budget? money(gate.budget,0):'—', 'definido no workload'));
  k.appendChild(kpi(gate.headroom>=0?'Folga':'Estouro', gate.budget? money(Math.abs(gate.headroom),0):'—', gate.budget? gate.usedPct.toFixed(0)+'% do orçamento':''));
  root.appendChild(k);

  if (gate.status==='NO-GO') {
    const sg = gateSuggestions(G, STAGES, G.budgetMonthly);
    const c = el('div','card'); c.appendChild(el('h3',null,'Caminho para caber no orçamento'));
    if (!sg.steps.length) c.appendChild(el('p','note','Nenhuma otimização automática aplicável. Revise engines, schedule ou o próprio orçamento.'));
    sg.steps.forEach((st,i)=> c.appendChild(el('div','step',
      `<div class="n">${i+1}</div><div><b>${st.title}</b><span>${st.why}</span></div>
       <div class="sv2">${money(st.newMonthly,0)}<em>−${money(st.saving,0)}/mês · SLA ${st.slaAfter}</em></div>`)));
    root.appendChild(c);
    root.appendChild(el('div','card', sg.reachable
      ? `<p class="verdict"><b class="pos-t">Com ${sg.steps.length} ajuste(s) o pipeline fica em ${money(sg.finalMonthly,0)}/mês</b>, dentro do orçamento de ${money(G.budgetMonthly,0)} (SLA ${sg.finalSla}). As otimizações são aplicadas em sequência, recalculando o pipeline a cada passo.</p>`
      : `<p class="verdict"><b class="neg-t">Mesmo aplicando as otimizações automáticas o custo fica em ${money(sg.finalMonthly,0)}/mês</b>, ainda acima de ${money(G.budgetMonthly,0)}. Será preciso revisar a arquitetura (aba Compare scenarios), o escopo ou o orçamento.</p>`));
  } else if (gate.status==='REVIEW') {
    root.appendChild(el('div','card','<p class="verdict">Para reduzir a incerteza, informe mais parâmetros avançados (aumenta o confidence) ou aplique as oportunidades da aba Optimization.</p>'));

  return root;
}

  const t = el('table','cmp');
  t.appendChild(el('tr',null,`<th>Frequência</th><th class="r">Execuções/dia</th><th class="r">Custo/mês</th><th class="r">Δ vs. atual</th><th class="r">Custo/ano</th><th class="r">Latência</th><th>SLA</th>`));
  sweep.forEach(s=>{
    const delta = s.monthly - cur.monthly;
    const tr = el('tr'); if (s.runsPerDay===curFreq) tr.className='hl';
    tr.innerHTML = `<td>${s.label}${s.runsPerDay===curFreq?' <i class="badge-adv">atual</i>':''}</td>
      <td class="r">${s.runsPerDay}</td>

      <td class="r ${delta>0?'neg-t':delta<0?'pos-t':''}">${delta===0?'—':(delta>0?'+':'')+money(delta,0)+' ('+(delta/cur.monthly*100).toFixed(0)+'%)'}</td>
      <td class="r">${money(s.monthly*12,0)}</td>
      <td class="r">${mins(s.latencyMin)}</td>
      <td><span class="sla ${slaCls(s.slaStatus)}">${s.slaStatus}</span></td>`;
    t.appendChild(tr);
  });
  const c2 = el('div','card'); c2.appendChild(el('h3',null,'Tabela de impacto')); c2.appendChild(t);
  root.appendChild(c2);

  // qual estágio puxa o custo quando a frequência sobe
  const lo = sweep[0], hi = sweep[sweep.length-1];
  const drivers = Object.keys(hi.perStage).map(k => ({
    key:k, name:(STAGES.find(s=>s.key===k)||{}).name || k,
    delta: hi.perStage[k] - lo.perStage[k],
  })).sort((a,b)=>b.delta-a.delta).filter(d=>d.delta>0);
  const c3 = el('div','card');
  c3.appendChild(el('h3',null,'Quem paga a conta da frequência'));
  c3.appendChild(el('p','note',`Comparando <b>${lo.label}</b> (${money(lo.monthly,0)}/mês) com <b>${hi.label}</b> (${money(hi.monthly,0)}/mês) — diferença de ${money(hi.monthly-lo.monthly,0)}/mês.`));
  if (drivers.length) c3.appendChild(barList(drivers.map(d=>[d.name,d.delta]), Math.max(1,hi.monthly-lo.monthly)));
  root.appendChild(c3);

  // leitura FinOps
  const target = sweep.find(s=>s.runsPerDay===24);

  if (target && daily) {
    const mult = target.monthly/daily.monthly;
    root.appendChild(el('div','card',
      `<h3>Leitura</h3><p class="verdict">Sair de <b>${daily.label}</b> para <b>${target.label}</b> multiplica o custo por <b>${mult.toFixed(2)}×</b> (${money(daily.monthly,0)} → ${money(target.monthly,0)}/mês) e reduz a latência de ${mins(daily.latencyMin)} para ${mins(target.latencyMin)}. O custo não cresce proporcionalmente ao número de execuções porque storage e retenção são independentes da frequência — o que cresce é compute, startups e mínimos de cobrança.</p>`));
  }
  return root;
}

function freqChart(sweep, curFreq) {
  const W=760,H=280,P={l:70,r:16,t:16,b:40};
  const maxY = Math.max(...sweep.map(s=>s.monthly))*1.08;
  const px = i => P.l + i/(sweep.length-1)*(W-P.l-P.r);
  const py = v => H-P.b - v/maxY*(H-P.t-P.b);
  let g = `<svg viewBox="0 0 ${W} ${H}" class="chart">`;
  for(let k=0;k<=4;k++){ const v=maxY*k/4,y=py(v);
    g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" class="grid"/><text x="${P.l-8}" y="${y+4}" class="ax r">${sym()}${Math.round(fx(v)).toLocaleString('en-US')}</text>`; }
  const bw = (W-P.l-P.r)/sweep.length*0.55;
  sweep.forEach((s,i)=>{
    const x=px(i), y=py(s.monthly);
    g+=`<rect x="${x-bw/2}" y="${y}" width="${bw}" height="${H-P.b-y}" rx="3" fill="${s.runsPerDay===curFreq?'#c2586e':'#4f6bed'}"/>`;
    g+=`<text x="${x}" y="${H-24}" class="ax c">${s.label}</text>`;
    g+=`<text x="${x}" y="${H-10}" class="ax c dim">${mins(s.latencyMin)}</text>`;
  });
  g+=`</svg>`;
  const w=el('div','chartwrap'); w.innerHTML=g; return w;
}

  else cross.forEach(x=>c3.appendChild(el('p','be',
    `Acima de <b>${num(x.tb,2)} TB/mês</b> (${num(x.multiplier,2)}× o volume atual), <b>${VARIANTS[x.to].name}</b> passa a ser mais barata que <b>${VARIANTS[x.from].name}</b>.`)));
  root.appendChild(c3);
  return root;
}

function lineChart(rows, ids) {
  const W=760,H=300,P={l:70,r:16,t:16,b:38};
  const xs = rows.map(r=>Math.log10(Math.max(r.tb,0.001)));
  const maxY = Math.max(...rows.flatMap(r=>ids.map(id=>r.costs[id])))*1.08;
  const minX=Math.min(...xs), maxX=Math.max(...xs);
  const px=v=>P.l+(v-minX)/(maxX-minX||1)*(W-P.l-P.r);
  const py=v=>H-P.b-v/maxY*(H-P.t-P.b);
  let g=`<svg viewBox="0 0 ${W} ${H}" class="chart">`;
  for(let k=0;k<=4;k++){const v=maxY*k/4,y=py(v);
    g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" class="grid"/><text x="${P.l-8}" y="${y+4}" class="ax r">${sym()}${Math.round(fx(v)).toLocaleString('en-US')}</text>`;}
  rows.forEach((r,i)=>{ g+=`<text x="${px(xs[i])}" y="${H-14}" class="ax c">${num(r.tb,r.tb<10?1:0)} TB</text>`; });
  ids.forEach((id,si)=>{
    g+=`<polyline points="${rows.map((r,i)=>`${px(xs[i])},${py(r.costs[id])}`).join(' ')}" fill="none" stroke="${SERIES[si%SERIES.length]}" stroke-width="2.5"/>`;
    rows.forEach((r,i)=>g+=`<circle cx="${px(xs[i])}" cy="${py(r.costs[id])}" r="3.5" fill="${SERIES[si%SERIES.length]}"/>`);
  });
  g+=`</svg>`;
  const w=el('div','chartwrap'); w.innerHTML=g; return w;
}

/* ==================================================================== */
const VIEWS = { pipeline:viewPipeline, result:viewResult, gate:viewGate, schedule:viewSchedule,
                compare:viewCompare, optimize:viewOptimize, sensitivity:viewSensitivity,
                assumptions:viewAssumptions };

function render() {
  const body = $('#tabBody');
  const act = document.activeElement;
  const fields = () => [...body.querySelectorAll('input,select')];
  const idx = fields().indexOf(act);
  const caret = idx >= 0 && act.selectionStart != null ? [act.selectionStart, act.selectionEnd] : null;
  const scroll = window.scrollY;
  renderSummary();
  body.innerHTML=''; body.appendChild(VIEWS[TAB]());
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.tab===TAB));
  if (idx >= 0) {
    const f = fields()[idx];
    if (f) { f.focus(); if (caret) try { f.setSelectionRange(...caret); } catch (e) {} }
  }
  window.scrollTo(0, scroll);
}

function boot() {
  $('#profile').onchange = e => { PROFILE=e.target.value; render(false); };
  $('#currency').onchange = e => { CURRENCY=e.target.value; render(false); };
  $('#advToggle').onchange = e => { SHOW_ADV=e.target.checked; render(); };
  $('#reset').onclick = () => { G=structuredClone(G_DEFAULTS); STAGES=STAGE_DEFAULTS(); render(); };
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{TAB=t.dataset.tab;render(false);});
  render();
}
document.addEventListener('DOMContentLoaded', boot);
