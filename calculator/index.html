<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataCost Architect — FinOps Data Architecture Simulator</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#14161a; --muted:#697084; --line:#e3e6ec;
  --accent:#4f6bed; --ok:#1f8a5b; --warn:#b47708; --bad:#c23b4b;
  --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;}
h1,h2,h3{margin:0;font-weight:640;letter-spacing:-0.01em}
code{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:#eef0f5;padding:1px 4px;border-radius:4px}

/* header */
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:14px 22px;background:#101423;color:#fff;}
header .brand h1{font-size:16px}
header .brand p{margin:2px 0 0;font-size:11.5px;color:#9aa3bd;letter-spacing:.04em;text-transform:uppercase}
header .sp{flex:1}
header label{font-size:11.5px;color:#9aa3bd;display:block;margin-bottom:3px;letter-spacing:.03em;text-transform:uppercase}
header select{background:#1c2236;color:#fff;border:1px solid #2c3450;border-radius:7px;padding:6px 9px;font-size:13px}
header button{background:#2c3450;color:#fff;border:0;border-radius:7px;padding:8px 12px;font-size:13px;cursor:pointer}
header button:hover{background:#3a4468}

/* layout */
.wrap{display:flex;align-items:flex-start;gap:0;min-height:calc(100vh - 62px)}
aside{width:330px;flex:0 0 330px;background:var(--panel);border-right:1px solid var(--line);
  padding:16px 16px 60px;height:calc(100vh - 62px);overflow-y:auto;position:sticky;top:0}
main{flex:1;min-width:0;padding:18px 22px 64px}

/* form */
.advbar{display:flex;align-items:center;gap:8px;padding:9px 11px;background:#eef1f8;border:1px solid var(--line);
  border-radius:var(--radius);margin-bottom:14px;font-size:12.5px;color:#3c4460}
.grp{margin-bottom:18px}
.grp h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:10px}
.fld{margin-bottom:9px}
.fld label{display:block;font-size:12px;color:#3c4460;margin-bottom:3px}
.fld .u{color:var(--muted);font-size:11px}
.badge-adv{font-style:normal;font-size:9.5px;background:#e6ebfb;color:#4257b8;border-radius:3px;padding:1px 4px;margin-left:4px;letter-spacing:.04em}
.fld input,.fld select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:7px;
  background:#fff;font-size:13px;color:var(--ink)}
.fld input:focus,.fld select:focus{outline:2px solid #c3cdf7;border-color:var(--accent)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;margin-bottom:7px;cursor:pointer}
.chk input{margin-top:2px}
.chk em{display:block;font-style:normal;font-size:11px;color:var(--muted)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tab{padding:8px 13px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;
  border-radius:6px 6px 0 0}
.tab:hover{background:#eef1f8}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* cards */
.lead{margin-bottom:16px}
.lead h2{font-size:20px;margin:4px 0 4px}
.lead p{margin:0;color:var(--muted);max-width:70ch}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;letter-spacing:.03em}
.pill-star{background:#fdf3d8;color:#8a6408}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;margin-bottom:14px}
.card h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:11px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;display:flex;flex-direction:column;gap:3px}
.k-l{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.k-v{font-size:22px;font-weight:660;letter-spacing:-0.02em}
.k-s{font-size:11.5px;color:var(--muted)}
.sla{font-size:16px;font-weight:700}
.sla.ok{color:var(--ok)} .sla.warn{color:var(--warn)} .sla.bad{color:var(--bad)}
.ok-t{color:var(--ok);font-size:11.5px} .bad-t{color:var(--bad);font-size:11.5px}
.meter{display:block;height:5px;background:#e6e9f0;border-radius:99px;overflow:hidden;margin-top:5px}
.meter span{display:block;height:100%;background:var(--accent)}

/* bars */
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:190px 1fr 132px;align-items:center;gap:10px;font-size:13px}
.bl{color:#3c4460}
.bt{display:block;height:15px;background:#eef0f5;border-radius:4px;overflow:hidden}
.bf{display:block;height:100%;border-radius:4px}
.bv{text-align:right;font-variant-numeric:tabular-nums}
.bv em{font-style:normal;color:var(--muted);font-size:11.5px;margin-left:4px}
.bar.total{border-top:1px solid var(--line);padding-top:7px;font-weight:660}

/* tables */
table.kv{width:100%;border-collapse:collapse;font-size:13px}
table.kv td{padding:5px 0;border-bottom:1px solid #f0f2f6}
table.kv td.r{text-align:right;font-variant-numeric:tabular-nums}
table.cmp{width:100%;border-collapse:collapse;font-size:12.5px}
table.cmp th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
  padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:bottom}
table.cmp td{padding:6px 8px;border-bottom:1px solid #f0f2f6;vertical-align:top}
table.cmp .r{text-align:right;font-variant-numeric:tabular-nums}
table.cmp th.r{text-align:right}
table.cmp .strong{font-weight:660}
table.cmp .src{color:var(--muted);font-size:11.5px}

/* misc */
.wrow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.wchip{font-size:12px;background:#eef1f8;border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.verdict{margin:0;font-size:13.5px;line-height:1.6}
.savebox{background:#eaf6ef;border:1px solid #c6e4d4;border-radius:var(--radius);padding:13px 15px;margin-bottom:14px}
.savebox span{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#2a6a4b}
.savebox b{font-size:24px;color:#186845;display:block;letter-spacing:-0.02em}
.savebox em{font-style:normal;font-size:12px;color:#3f7a5e}
.opt h3{color:var(--ink);text-transform:none;letter-spacing:0;font-size:14.5px}
.why{margin:0 0 11px;color:#4a5165;font-size:13px;max-width:80ch}
.optgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px}
.ms{background:#f7f8fb;border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.ms-l{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.ms-v{font-size:15px;font-weight:640}
.ms.pos .ms-v{color:var(--ok)} .ms.neg .ms-v{color:var(--bad)}
.list{margin:0;padding-left:18px;font-size:13px;color:#3c4460}
.list li{margin-bottom:5px}
.be{margin:0 0 8px;font-size:13.5px}
.chartwrap{width:100%;overflow-x:auto}
.chart{width:100%;min-width:520px;height:300px}
.chart .grid{stroke:#e8eaf0}
.chart .ax{font-size:10px;fill:#8a90a3}
.chart .ax.r{text-anchor:end} .chart .ax.c{text-anchor:middle}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:#4a5165}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}

@media (max-width:980px){
  .wrap{flex-direction:column}
  aside{width:100%;flex:none;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}
  .two{grid-template-columns:1fr}
  .bar{grid-template-columns:130px 1fr 104px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>DataCost Architect</h1>
    <p>FinOps Data Architecture Simulator · MVP mock v0.1</p>
  </div>
  <div class="sp"></div>
  <div>
    <label for="profile">Decision profile</label>
    <select id="profile">
      <option value="cost">Cost Optimized</option>
      <option value="balanced" selected>Balanced</option>
      <option value="performance">Performance Optimized</option>
    </select>
  </div>
  <div>
    <label for="currency">Currency</label>
    <select id="currency">
      <option value="USD" selected>USD</option>
      <option value="BRL">BRL</option>
      <option value="EUR">EUR</option>
    </select>
  </div>
  <button id="reset" type="button">Reset scenario</button>
</header>

<div class="wrap">
  <aside>
    <div class="advbar">
      <input type="checkbox" id="advToggle">
      <label for="advToggle" style="margin:0;cursor:pointer">Show advanced parameters</label>
    </div>
    <div id="form"></div>
  </aside>
  <main>
    <nav class="tabs">
      <div class="tab on" data-tab="result">Result</div>
      <div class="tab" data-tab="compare">Compare scenarios</div>
      <div class="tab" data-tab="optimize">Optimization</div>
      <div class="tab" data-tab="sensitivity">Sensitivity &amp; break-even</div>
      <div class="tab" data-tab="assumptions">Assumptions</div>
    </nav>
    <div id="tabBody"></div>
  </main>
</div>

<script>
/* =====================================================================
   DataCost Architect — Calculation / Pricing / Recommendation Engine
   ---------------------------------------------------------------------
   Protótipo (mock) do MVP do TCC. Toda a lógica de preço fica FORA do
   código de cálculo: a tabela PRICING é a "pricing database" (seção 38
   do scopo.md) e o motor apenas a consulta por (provider, service, sku).
   Cada preço carrega valid_from / source para reprodutibilidade
   acadêmica (seção 39).
   ===================================================================== */

/* ------------------------------------------------------------------ */
/* 1. PRICING DATABASE                                                 */
/* ------------------------------------------------------------------ */
const PRICING = [
  // --- AWS -----------------------------------------------------------
  { provider:'AWS', service:'S3',       region:'us-east-1', sku:'standard-storage', metric:'Storage',      unit:'GB-month',   price:0.023,  currency:'USD', valid_from:'2025-01-01', source:'AWS S3 Pricing' },
  { provider:'AWS', service:'S3',       region:'us-east-1', sku:'ia-storage',       metric:'Storage',      unit:'GB-month',   price:0.0125, currency:'USD', valid_from:'2025-01-01', source:'AWS S3 Pricing' },
  { provider:'AWS', service:'S3',       region:'us-east-1', sku:'put-requests',     metric:'Requests',     unit:'1k requests',price:0.005,  currency:'USD', valid_from:'2025-01-01', source:'AWS S3 Pricing' },
  { provider:'AWS', service:'S3',       region:'us-east-1', sku:'get-requests',     metric:'Requests',     unit:'1k requests',price:0.0004, currency:'USD', valid_from:'2025-01-01', source:'AWS S3 Pricing' },
  { provider:'AWS', service:'Glue',     region:'us-east-1', sku:'etl-dpu',          metric:'Compute',      unit:'DPU-hour',   price:0.44,   currency:'USD', valid_from:'2025-01-01', source:'AWS Glue Pricing' },
  { provider:'AWS', service:'Athena',   region:'us-east-1', sku:'data-scanned',     metric:'Query',        unit:'TB scanned', price:5.00,   currency:'USD', valid_from:'2025-01-01', source:'Amazon Athena Pricing' },
  { provider:'AWS', service:'Network',  region:'us-east-1', sku:'cross-region-out', metric:'Transfer',     unit:'GB',         price:0.02,   currency:'USD', valid_from:'2025-01-01', source:'AWS Data Transfer Pricing' },
  { provider:'AWS', service:'Network',  region:'us-east-1', sku:'internet-out',     metric:'Transfer',     unit:'GB',         price:0.09,   currency:'USD', valid_from:'2025-01-01', source:'AWS Data Transfer Pricing' },
  { provider:'AWS', service:'EC2',      region:'us-east-1', sku:'m5.xlarge',        metric:'Compute',      unit:'node-hour',  price:0.192,  currency:'USD', valid_from:'2025-01-01', source:'AWS EC2 On-Demand Pricing' },
  { provider:'AWS', service:'EC2',      region:'us-east-1', sku:'m5.2xlarge',       metric:'Compute',      unit:'node-hour',  price:0.384,  currency:'USD', valid_from:'2025-01-01', source:'AWS EC2 On-Demand Pricing' },
  // --- Snowflake -----------------------------------------------------
  { provider:'Snowflake', service:'Warehouse', region:'aws-us-east-1', sku:'credit-standard',   metric:'Compute', unit:'credit',   price:2.00, currency:'USD', valid_from:'2025-01-01', source:'Snowflake Credit Consumption Table' },
  { provider:'Snowflake', service:'Warehouse', region:'aws-us-east-1', sku:'credit-enterprise', metric:'Compute', unit:'credit',   price:3.00, currency:'USD', valid_from:'2025-01-01', source:'Snowflake Credit Consumption Table' },
  { provider:'Snowflake', service:'Storage',   region:'aws-us-east-1', sku:'capacity-storage',  metric:'Storage', unit:'TB-month', price:23.00, currency:'USD', valid_from:'2025-01-01', source:'Snowflake Storage Pricing' },
  // --- Databricks ----------------------------------------------------
  { provider:'Databricks', service:'Jobs Compute',  region:'aws-us-east-1', sku:'dbu-jobs-premium',    metric:'Compute', unit:'DBU', price:0.15, currency:'USD', valid_from:'2025-01-01', source:'Databricks Pricing (Jobs Compute, Premium)' },
  { provider:'Databricks', service:'SQL Warehouse', region:'aws-us-east-1', sku:'dbu-sql-serverless',  metric:'Compute', unit:'DBU', price:0.70, currency:'USD', valid_from:'2025-01-01', source:'Databricks Pricing (SQL Serverless)' },
];

const price = (provider, service, sku) => {
  const r = PRICING.find(p => p.provider===provider && p.service===service && p.sku===sku);
  if (!r) throw new Error(`Preço não encontrado: ${provider}/${service}/${sku}`);
  return r.price;
};

/* Câmbio — APENAS camada de apresentação (seção 25 do scopo.md). */
const FX = { USD: 1, BRL: 5.40, EUR: 0.92 };

/* ------------------------------------------------------------------ */
/* 2. CATÁLOGOS / FATORES TÉCNICOS                                     */
/* ------------------------------------------------------------------ */
// Razão de compressão: bytes gravados / bytes lidos da fonte.
const COMPRESSION = {
  'parquet-zstd':  { ratio:0.18, label:'Parquet + ZSTD' },
  'parquet-snappy':{ ratio:0.25, label:'Parquet + Snappy' },
  'avro-snappy':   { ratio:0.45, label:'Avro + Snappy' },
  'csv-gzip':      { ratio:0.35, label:'CSV + GZIP' },
  'json-none':     { ratio:1.00, label:'JSON (sem compressão)' },
};

// Throughput de processamento em GB de origem por worker-minuto.
const ENGINES = {
  glue:            { label:'AWS Glue (Spark)',          gbPerWorkerMin:0.45, startupMin:1.5, complexity:2 },
  databricks:      { label:'Databricks Jobs (Spark)',   gbPerWorkerMin:0.60, startupMin:3.0, complexity:3 },
  databricksPhoton:{ label:'Databricks Jobs (Photon)',  gbPerWorkerMin:0.95, startupMin:3.0, complexity:3 },
};

// Warehouse Snowflake: créditos/hora e throughput de carga (GB/min).
const WH_SIZES = {
  XS: { credits:1,  gbPerMin:1.5 },
  S:  { credits:2,  gbPerMin:3.0 },
  M:  { credits:4,  gbPerMin:6.0 },
  L:  { credits:8,  gbPerMin:12.0 },
};

const WORKER_TYPES = {
  'm5.xlarge':  { dbu:1.0, sku:'m5.xlarge',  label:'m5.xlarge (4 vCPU)' },
  'm5.2xlarge': { dbu:2.0, sku:'m5.2xlarge', label:'m5.2xlarge (8 vCPU)' },
};

const DAYS = 30.4; // dias médios por mês

/* ------------------------------------------------------------------ */
/* 3. ARQUITETURAS COMPARÁVEIS (cenários)                              */
/* ------------------------------------------------------------------ */
const ARCHITECTURES = {
  A: {
    id:'A', name:'AWS Serverless Lakehouse',
    stack:['AWS Glue','Amazon S3','Amazon Athena'],
    processing:'glue', warehouse:'athena', components:3, complexity:2,
    note:'Ingestão e transformação em Glue, consumo analítico direto no S3 via Athena.'
  },
  B: {
    id:'B', name:'AWS Glue + Snowflake',
    stack:['AWS Glue','Amazon S3','Snowflake'],
    processing:'glue', warehouse:'snowflake', components:3, complexity:3,
    note:'Transformação em Glue, camada curada carregada em Snowflake.'
  },
  C: {
    id:'C', name:'Databricks + Snowflake',
    stack:['Databricks','Amazon S3','Snowflake'],
    processing:'databricksPhoton', warehouse:'snowflake', components:3, complexity:4,
    note:'Processamento em Databricks (Photon), warehouse Snowflake para BI.'
  },
  D: {
    id:'D', name:'Databricks Lakehouse',
    stack:['Databricks','Amazon S3','Databricks SQL'],
    processing:'databricksPhoton', warehouse:'dbsql', components:2, complexity:3,
    note:'Plataforma única: processamento e serving em Databricks.'
  },
};

/* ------------------------------------------------------------------ */
/* 4. MOTOR DE CÁLCULO                                                 */
/* ------------------------------------------------------------------ */
/**
 * @param {object} i  inputs do workload (ver INPUT_DEFAULTS no app.js)
 * @param {object} arch  arquitetura de ARCHITECTURES
 * @returns {object} resultado com breakdown, unit economics, SLA e confiança
 */
function calculate(i, arch) {
  const assumptions = [];
  const A = (t) => assumptions.push(t);

  /* --- 4.1 Volume por execução ------------------------------------- */
  const runsPerDay   = i.runsPerDay;
  const runsPerMonth = runsPerDay * DAYS;

  let volPerRun;
  if (i.ingestion === 'full') {
    volPerRun = i.sourceVolumeGB;
    A('Full load: cada execução lê o volume total da fonte.');
  } else if (i.ingestion === 'incremental') {
    volPerRun = i.dailyDeltaGB / runsPerDay;
    A('Incremental: volume diário distribuído igualmente entre as execuções.');
  } else { // cdc
    volPerRun = (i.dailyDeltaGB * 1.30) / runsPerDay;
    A('CDC: acréscimo de 30% sobre o delta diário para metadados de before/after image.');
  }

  const retryFactor = 1 + (i.failureRate/100) * i.retries;
  if (retryFactor > 1) A(`Retries: multiplicador de ${retryFactor.toFixed(3)}x sobre custos de compute e requests.`);

  const comp = COMPRESSION[i.format];
  const monthlyRawGB        = volPerRun * runsPerMonth;
  const monthlyWrittenGB    = monthlyRawGB * comp.ratio;
  const backfillGB          = i.backfillGB;

  /* --- 4.2 Storage (S3) -------------------------------------------- */
  // Estado estacionário: retenção aplicada ao volume diário gravado.
  const dailyWrittenGB = monthlyWrittenGB / DAYS;
  const baseGB         = i.ingestion === 'full' ? i.sourceVolumeGB * comp.ratio : i.sourceVolumeGB * comp.ratio;
  const retainedGB     = dailyWrittenGB * Math.min(i.retentionDays, 3650);
  const avgStorageGB   = baseGB + retainedGB;
  A(`Storage em estado estacionário: base comprimida + ${i.retentionDays} dias de retenção.`);

  const storageSku  = i.storageClass === 'ia' ? 'ia-storage' : 'standard-storage';
  const costStorage = avgStorageGB * price('AWS','S3',storageSku);

  // Requests: arquivos por execução
  const filesPerRun = Math.max(1, Math.ceil((volPerRun * comp.ratio * 1024) / i.targetFileMB));
  const putReqs     = filesPerRun * runsPerMonth * retryFactor;
  const getReqs     = filesPerRun * runsPerMonth * 2; // leitura pelo processamento + pelo serving
  const costRequests= (putReqs/1000)*price('AWS','S3','put-requests') + (getReqs/1000)*price('AWS','S3','get-requests');

  /* --- 4.3 Ingestão ------------------------------------------------- */
  // Job de extração dedicado (2 DPU em Glue) — proporcional ao volume lido.
  // Comum às quatro arquiteturas: todas ingerem de fonte on-premises para o S3.
  const ingestMin  = Math.max(1, volPerRun / 4.0) + 1.0;
  const costIngest = 2 * (ingestMin/60) * price('AWS','Glue','etl-dpu') * runsPerMonth * retryFactor;
  A('Ingestão modelada como job de extração de 2 DPU (throughput 4 GB/min), igual nas quatro arquiteturas.');

  /* --- 4.4 Processamento -------------------------------------------- */
  const eng = ENGINES[arch.processing];
  const workers = i.autoscaling ? Math.max(2, Math.round(i.workers * 0.75)) : i.workers;
  if (i.autoscaling) A('Autoscaling ligado: utilização média estimada em 75% dos workers máximos.');

  const computeMin  = volPerRun / (eng.gbPerWorkerMin * workers);
  const runtimeMin  = i.measuredRuntimeMin > 0 ? i.measuredRuntimeMin : eng.startupMin + computeMin;
  if (i.measuredRuntimeMin > 0) A(`Runtime medido (${i.measuredRuntimeMin} min) sobrepõe a estimativa por throughput.`);
  const billedHours = Math.max(runtimeMin, 1) / 60;

  let costProcessing;
  if (arch.processing === 'glue') {
    const dpus = workers + 1; // + driver
    costProcessing = dpus * billedHours * price('AWS','Glue','etl-dpu') * runsPerMonth * retryFactor;
  } else {
    const wt = WORKER_TYPES[i.workerType];
    const nodes = workers + 1; // + driver
    const perNodeHour = wt.dbu * price('Databricks','Jobs Compute','dbu-jobs-premium') + price('AWS','EC2',wt.sku);
    const photon = arch.processing === 'databricksPhoton' ? 2.0 : 1.0; // Photon cobra 2x DBU
    costProcessing = nodes * billedHours * (wt.dbu*price('Databricks','Jobs Compute','dbu-jobs-premium')*photon + price('AWS','EC2',wt.sku)) * runsPerMonth * retryFactor;
    if (photon>1) A('Databricks Photon: DBU cobrado em 2x, compensado por throughput ~1,6x maior.');
    void perNodeHour;
  }

  // Backfill mensal tratado como execução extra de mesmo perfil
  if (backfillGB > 0) {
    const bfMin = eng.startupMin + backfillGB/(eng.gbPerWorkerMin*workers);
    const bfHours = bfMin/60;
    costProcessing += (workers+1) * bfHours * (arch.processing==='glue'
      ? price('AWS','Glue','etl-dpu')
      : (WORKER_TYPES[i.workerType].dbu*price('Databricks','Jobs Compute','dbu-jobs-premium')+price('AWS','EC2',WORKER_TYPES[i.workerType].sku)));
    A(`Backfill de ${backfillGB} GB/mês incluído como execução adicional.`);
  }

  /* --- 4.5 Warehouse / Serving --------------------------------------- */
  let costWarehouse = 0, whLoadMin = 0, whDetail = '';
  const curatedGB = avgStorageGB * i.curatedRatio;

  if (arch.warehouse === 'snowflake') {
    const sz = WH_SIZES[i.whSize];
    whLoadMin = (volPerRun * comp.ratio) / sz.gbPerMin;
    const loadHours  = (whLoadMin/60) * runsPerMonth;
    const queryHours = (i.queriesPerDay * DAYS * i.avgQuerySec/3600);
    const idleHours  = (runsPerMonth * i.autoSuspendSec/3600);
    const credits    = (loadHours + queryHours + idleHours) * sz.credits;
    const creditCost = credits * price('Snowflake','Warehouse', i.snowflakeEdition==='enterprise' ? 'credit-enterprise':'credit-standard');
    const storeCost  = (curatedGB/1024) * price('Snowflake','Storage','capacity-storage');
    costWarehouse = creditCost + storeCost;
    whDetail = `${credits.toFixed(1)} créditos/mês (warehouse ${i.whSize}) + ${(curatedGB/1024).toFixed(2)} TB de storage`;
    A(`Snowflake: idle de auto-suspend (${i.autoSuspendSec}s) cobrado a cada execução.`);
  } else if (arch.warehouse === 'athena') {
    const scannedTB = (i.queriesPerDay * DAYS * i.scanPerQueryGB) / 1024;
    costWarehouse = scannedTB * price('AWS','Athena','data-scanned');
    whLoadMin = 0;
    whDetail = `${scannedTB.toFixed(2)} TB escaneados/mês`;
    A('Athena: sem carga; custo proporcional ao volume escaneado por consulta.');
  } else { // Databricks SQL Serverless
    const dbuPerQueryHour = 4; // SQL warehouse small ≈ 4 DBU/h
    const queryHours = (i.queriesPerDay * DAYS * i.avgQuerySec/3600);
    costWarehouse = queryHours * dbuPerQueryHour * price('Databricks','SQL Warehouse','dbu-sql-serverless');
    whLoadMin = 0;
    whDetail = `${(queryHours*dbuPerQueryHour).toFixed(1)} DBU/mês em SQL Serverless`;
    A('Databricks SQL Serverless: sem carga adicional (lê a camada curada no S3).');
  }

  /* --- 4.6 Rede ------------------------------------------------------ */
  const costNetwork = i.crossRegionGB * price('AWS','Network','cross-region-out')
                    + i.internetGB    * price('AWS','Network','internet-out');

  /* --- 4.7 Totais e descontos ---------------------------------------- */
  const gross = {
    Ingestion : costIngest,
    Storage   : costStorage + costRequests,
    Processing: costProcessing,
    Warehouse : costWarehouse,
    Network   : costNetwork,
  };
  const disc = 1 - i.discountPct/100;
  const breakdown = {};
  Object.entries(gross).forEach(([k,v]) => breakdown[k] = v * disc);
  const monthly = Object.values(breakdown).reduce((a,b)=>a+b,0);
  if (i.discountPct>0) A(`Desconto contratual de ${i.discountPct}% aplicado sobre o preço de lista.`);

  /* --- 4.8 SLA e freshness ------------------------------------------- */
  const pipelineMin = ingestMin + runtimeMin + whLoadMin;
  const intervalMin = (24*60)/runsPerDay;
  const freshnessMin= intervalMin + pipelineMin;

  const slaTimeOk   = pipelineMin <= i.slaMaxMinutes;
  const freshnessOk = freshnessMin <= i.freshnessHours*60;
  const slaStatus = slaTimeOk && freshnessOk ? 'PASS' : (slaTimeOk || freshnessOk ? 'PARTIAL' : 'FAIL');

  /* --- 4.9 Confidence score (seção 37) -------------------------------- */
  let conf = 55;
  const provided = i._provided || {};
  const advancedKeys = ['retentionDays','targetFileMB','failureRate','retries','crossRegionGB','queriesPerDay','autoSuspendSec','discountPct','recordsPerDay','backfillGB','curatedRatio'];
  const filled = advancedKeys.filter(k => provided[k]).length;
  conf += filled * 3;                         // +3 por parâmetro avançado informado
  if (i.autoscaling) conf -= 6;               // variabilidade
  if (i.failureRate > 5) conf -= 5;
  if (i.ingestion === 'streaming') conf -= 5;
  if (i.measuredRuntimeMin > 0) conf += 8;    // runtime medido em vez de estimado
  conf = Math.max(35, Math.min(92, conf));

  const spread = (100 - conf)/100 * 0.9;      // faixa relativa
  const range = { low: monthly*(1-spread), high: monthly*(1+spread) };

  /* --- 4.10 Unit economics -------------------------------------------- */
  const tbProcessed = monthlyRawGB/1024;
  const unit = {
    perMonth     : monthly,
    perYear      : monthly*12,
    perRun       : monthly / Math.max(runsPerMonth,1),
    perTB        : tbProcessed>0 ? monthly/tbProcessed : 0,
    perGBIngested: monthlyRawGB>0 ? monthly/monthlyRawGB : 0,
    perGBStored  : avgStorageGB>0 ? monthly/avgStorageGB : 0,
    perMillionRec: i.recordsPerDay>0 ? monthly/((i.recordsPerDay*DAYS)/1e6) : 0,
    perQuery     : i.queriesPerDay>0 ? monthly/(i.queriesPerDay*DAYS) : 0,
  };

  return {
    arch, breakdown, monthly, range, confidence: conf,
    runsPerMonth, volPerRun, monthlyRawGB, monthlyWrittenGB, avgStorageGB,
    filesPerRun, ingestMin, runtimeMin, whLoadMin, pipelineMin, freshnessMin,
    slaStatus, slaTimeOk, freshnessOk, unit, whDetail, assumptions,
    tbProcessed,
  };
}

/* ------------------------------------------------------------------ */
/* 5. MOTOR DE RECOMENDAÇÃO (multicritério — seção 31/32)              */
/* ------------------------------------------------------------------ */
const PROFILES = {
  cost:        { label:'Cost Optimized',        w:{cost:.55, sla:.20, perf:.15, scale:.05, cx:.05} },
  balanced:    { label:'Balanced',              w:{cost:.40, sla:.25, perf:.20, scale:.10, cx:.05} },
  performance: { label:'Performance Optimized', w:{cost:.20, sla:.35, perf:.30, scale:.10, cx:.05} },
};

function score(results, weights) {
  const costs = results.map(r=>r.monthly);
  const times = results.map(r=>r.pipelineMin);
  const minC = Math.min(...costs), maxC = Math.max(...costs);
  const minT = Math.min(...times), maxT = Math.max(...times);
  const norm = (v,mn,mx) => mx===mn ? 1 : 1 - (v-mn)/(mx-mn); // 1 = melhor

  return results.map(r => {
    const sCost = norm(r.monthly, minC, maxC);
    const sPerf = norm(r.pipelineMin, minT, maxT);
    const sSla  = r.slaStatus==='PASS' ? 1 : r.slaStatus==='PARTIAL' ? 0.5 : 0;
    const sScale= r.arch.processing.startsWith('databricks') ? 1 : 0.75;
    const sCx   = 1 - (r.arch.complexity-2)/3;
    const total = weights.cost*sCost + weights.sla*sSla + weights.perf*sPerf
                + weights.scale*sScale + weights.cx*Math.max(0,sCx);
    return { ...r, score: total*100, parts:{sCost,sPerf,sSla,sScale,sCx} };
  }).sort((a,b)=>b.score-a.score);
}

/* ------------------------------------------------------------------ */
/* 6. MOTOR DE OTIMIZAÇÃO (seção 33)                                   */
/* ------------------------------------------------------------------ */
const OPT_RULES = [
  {
    id:'full-to-incremental',
    title:'Migrar de Full Load para Incremental',
    why:'O delta diário representa uma fração pequena do volume total; reprocessar a base inteira a cada execução multiplica compute e escrita.',
    applies: i => i.ingestion==='full' && i.dailyDeltaGB < i.sourceVolumeGB*0.25,
    patch:   i => ({...i, ingestion:'incremental'}),
  },
  {
    id:'columnar-format',
    title:'Adotar Parquet + Snappy na camada raw',
    why:'Formato colunar comprimido reduz storage, requests e volume lido pelas engines de consulta.',
    applies: i => i.format==='json-none' || i.format==='csv-gzip',
    patch:   i => ({...i, format:'parquet-snappy'}),
  },
  {
    id:'auto-suspend',
    title:'Reduzir auto-suspend do warehouse para 60s',
    why:'Warehouse suspenso não consome créditos; janelas de ociosidade longas são cobradas a cada execução.',
    applies: i => i.autoSuspendSec > 120,
    patch:   i => ({...i, autoSuspendSec:60}),
  },
  {
    id:'file-compaction',
    title:'Compactar arquivos para ~128 MB',
    why:'Muitos arquivos pequenos aumentam custo de requests e o overhead de planejamento das engines.',
    applies: i => i.targetFileMB < 64,
    patch:   i => ({...i, targetFileMB:128}),
  },
  {
    id:'reduce-frequency',
    title:'Reduzir a frequência de execução',
    why:'A frequência atual entrega dados muito antes do requisito de freshness; há folga para executar menos vezes.',
    applies: (i,res) => res && res.freshnessMin < i.freshnessHours*60*0.5 && i.runsPerDay > 1,
    patch:   i => ({...i, runsPerDay: Math.max(1, Math.round(i.runsPerDay/2))}),
  },
  {
    id:'rightsize-warehouse',
    title:'Reduzir o tamanho do virtual warehouse',
    why:'O tempo total do pipeline está bem abaixo do SLA; um warehouse menor mantém o SLA a metade do custo de créditos.',
    applies: (i,res) => res && res.pipelineMin < i.slaMaxMinutes*0.5 && ['M','L'].includes(i.whSize),
    patch:   i => ({...i, whSize: i.whSize==='L' ? 'M' : 'S'}),
  },
  {
    id:'lifecycle-ia',
    title:'Mover dados frios para S3 Standard-IA',
    why:'Retenção longa com baixa frequência de leitura é candidata a classe de armazenamento mais barata.',
    applies: i => i.retentionDays >= 180 && i.storageClass==='standard' && i.queriesPerDay < 200,
    patch:   i => ({...i, storageClass:'ia'}),
  },
];

function findOptimizations(inputs, arch, base) {
  const out = [];
  for (const rule of OPT_RULES) {
    if (!rule.applies(inputs, base)) continue;
    const patched = rule.patch(inputs);
    const after = calculate(patched, arch);
    const saving = base.monthly - after.monthly;
    if (saving <= base.monthly*0.01) continue; // ignora ganhos < 1%
    out.push({
      ...rule, saving, savingPct: saving/base.monthly*100,
      newMonthly: after.monthly,
      slaBefore: base.slaStatus, slaAfter: after.slaStatus,
      patched,
    });
  }
  return out.sort((a,b)=>b.saving-a.saving);
}

/* ------------------------------------------------------------------ */
/* 7. SENSIBILIDADE E BREAK-EVEN (seções 34/35)                        */
/* ------------------------------------------------------------------ */
const SENS_MULTIPLIERS = [0.25, 0.5, 1, 2, 4, 8, 16];

function scaleInputs(i, m) {
  return { ...i,
    sourceVolumeGB: i.sourceVolumeGB*m,
    dailyDeltaGB  : i.dailyDeltaGB*m,
    recordsPerDay : i.recordsPerDay*m,
    backfillGB    : i.backfillGB*m,
    scanPerQueryGB: i.scanPerQueryGB*m,
  };
}

function sensitivity(inputs, archIds) {
  return SENS_MULTIPLIERS.map(m => {
    const scaled = scaleInputs(inputs, m);
    const row = { multiplier:m, tb: (calculate(scaled, ARCHITECTURES[archIds[0]]).monthlyRawGB)/1024, costs:{} };
    archIds.forEach(id => row.costs[id] = calculate(scaled, ARCHITECTURES[id]).monthly);
    return row;
  });
}

/** Varre o multiplicador de volume procurando trocas de liderança. */
function breakEven(inputs, archIds) {
  const steps = 80, lo = Math.log10(0.1), hi = Math.log10(30);
  let prevLeader = null; const crossings = [];
  for (let s=0; s<=steps; s++) {
    const m = Math.pow(10, lo + (hi-lo)*s/steps);
    const scaled = scaleInputs(inputs, m);
    let best=null;
    archIds.forEach(id => {
      const c = calculate(scaled, ARCHITECTURES[id]).monthly;
      if (!best || c < best.cost) best = { id, cost:c };
    });
    if (prevLeader && best.id !== prevLeader.id) {
      const tb = calculate(scaled, ARCHITECTURES[best.id]).monthlyRawGB/1024;
      crossings.push({ multiplier:m, tb, from:prevLeader.id, to:best.id, cost:best.cost });
    }
    prevLeader = best;
  }
  return crossings;
}

function rawField(label, type, value, unit, onchange) {

  return w;
}

function field(def) {

  if (type==='checkbox') {
    const row = el('label','chk');

    cb.onchange = () => { STATE[key]=cb.checked; STATE._provided[key]=true; render(); };
    row.appendChild(cb); row.appendChild(el('span',null,label));
    w.appendChild(row);
    return w;
  }

  w.appendChild(el('label',null, label + (unit?` <span class="u">${unit}</span>`:'') + (advanced?' <i class="badge-adv">adv</i>':'')));

  if (type==='select') {
    const s = el('select');
    opts.forEach(o => {
      const [v,t] = Array.isArray(o) ? o : [o,o];
      const op = el('option',null,t); op.value=v;

      s.appendChild(op);

    const inp = el('input'); inp.type=type; inp.value=STATE[key];

      STATE[key] = type==='number' ? (+inp.value||0) : inp.value;

      render(false);

}

/* ---------- view: RESULT ---------- */
function viewResult(ranked) {

  const tot = el('div','bar total');
  tot.appendChild(el('span','bl','Total'));
  tot.appendChild(el('span','bt',''));
  tot.appendChild(el('span','bv', money(r.monthly,0)));
  bd.appendChild(tot);
  card.appendChild(bd);
  root.appendChild(card);

  // unit economics + pipeline
  const two = el('div','two');

  const ue = el('div','card');
  ue.appendChild(el('h3',null,'Unit economics'));
  const rows = [
    ['Cost per GB ingested', money4(r.unit.perGBIngested)],
    ['Cost per GB stored',   money4(r.unit.perGBStored)],
    ['Cost per million records', STATE.recordsPerDay? money(r.unit.perMillionRec,3):'—'],
    ['Cost per query',       STATE.queriesPerDay? money4(r.unit.perQuery):'—'],
    ['Cost per execution',   money4(r.unit.perRun)],
    ['Data processed',       num(r.tbProcessed,2)+' TB/month'],
    ['Data stored (avg)',    num(r.avgStorageGB/1024,2)+' TB'],
    ['Files written / run',  num(r.filesPerRun,0)],
  ];
  ue.appendChild(table(rows));
  two.appendChild(ue);

  const pl = el('div','card');
  pl.appendChild(el('h3',null,'Pipeline timing'));
  pl.appendChild(table([
    ['Ingestion',  num(r.ingestMin,1)+' min'],
    ['Processing', num(r.runtimeMin,1)+' min'],
    ['Warehouse load', num(r.whLoadMin,1)+' min'],
    ['<b>End-to-end</b>', '<b>'+num(r.pipelineMin,1)+' min</b>'],
    ['SLA limit', SLA.slaMaxMinutes+' min &nbsp;'+(r.slaTimeOk?'<span class="ok-t">met</span>':'<span class="bad-t">exceeded</span>')],
    ['Data freshness', num(r.freshnessMin/60,2)+' h'],
    ['Freshness requirement', SLA.freshnessHours+' h &nbsp;'+(r.freshnessOk?'<span class="ok-t">met</span>':'<span class="bad-t">exceeded</span>')],
    ['Warehouse detail', r.whDetail],
  ]));
  two.appendChild(pl);
  root.appendChild(two);

  const note = el('p','note','Estimativa baseada em preço de lista; não representa uma fatura real. Veja a aba <b>Assumptions</b> para premissas e limitações.');
  root.appendChild(note);
  return root;
}

const SERIES = ['#4f6bed','#2fa8a0','#e0a32e','#c2586e','#7a6ff0'];

function kpi(label, value, sub) {
  const d = el('div','kpi');
  d.appendChild(el('span','k-l',label));
  d.appendChild(el('span','k-v',value));
  if (sub) d.appendChild(el('span','k-s',sub));
  return d;
}
function confBar(c) {
  return `<span class="meter"><span style="width:${c}%"></span></span>`;
}
function table(rows) {
  const t = el('table','kv');
  rows.forEach(([a,b]) => {
    const tr = el('tr'); tr.appendChild(el('td',null,a)); tr.appendChild(el('td','r',b)); t.appendChild(tr);
  });
  return t;
}

/* ---------- view: COMPARE ---------- */
function viewCompare(ranked, weights) {
  const root = el('div');
  root.appendChild(el('div','lead','<h2>Scenario comparison</h2><p>Mesmo workload, arquiteturas diferentes. O ranking usa pesos multicritério — não apenas o menor preço.</p>'));

  // chart
  const chart = el('div','card');
  chart.appendChild(el('h3',null,'Monthly cost by architecture'));
  const maxC = Math.max(...ranked.map(r=>r.monthly));
  const bars = el('div','bars');
  ranked.forEach((r,idx) => {
    const row = el('div','bar');
    row.appendChild(el('span','bl',`${r.arch.id} · ${r.arch.name}`));
    const track = el('span','bt');
    const fill = el('span','bf'); fill.style.width=(r.monthly/maxC*100)+'%'; fill.style.background=SERIES[idx%SERIES.length];
    track.appendChild(fill); row.appendChild(track);
    row.appendChild(el('span','bv', money(r.monthly,0)));
    bars.appendChild(row);
  });
  chart.appendChild(bars);
  root.appendChild(chart);

  // table
  const c = el('div','card');
  c.appendChild(el('h3',null,'Indicators'));
  const t = el('table','cmp');
  const head = el('tr');
  head.appendChild(el('th',null,'Indicator'));
  ranked.forEach(r => head.appendChild(el('th','r',`${r.arch.id} · ${r.arch.name}`)));
  t.appendChild(head);

  const line = (label, fn, cls='') => {
    const tr = el('tr'); tr.appendChild(el('td',null,label));
    ranked.forEach(r => tr.appendChild(el('td','r '+cls, fn(r))));
    t.appendChild(tr);
  };
  line('Stack', r => r.arch.stack.join('<br>'));
  line('Monthly cost', r => money(r.monthly,0), 'strong');
  line('Annual cost', r => money(r.unit.perYear,0));
  line('Estimate range', r => `${money(r.range.low,0)} – ${money(r.range.high,0)}`);
  line('End-to-end time', r => num(r.pipelineMin,1)+' min');
  line('SLA', r => `<span class="sla ${r.slaStatus==='PASS'?'ok':r.slaStatus==='PARTIAL'?'warn':'bad'}">${r.slaStatus}</span>`);
  line('Cost / TB', r => money(r.unit.perTB,2));
  line('Cost / run', r => money4(r.unit.perRun));
  line('Confidence', r => r.confidence+'%');
  line('Components', r => r.arch.components);
  line('Score', r => `<b>${r.score.toFixed(1)}</b>`, 'strong');
  c.appendChild(t);
  root.appendChild(c);

  // weights
  const w = el('div','card');
  w.appendChild(el('h3',null,`Decision profile — ${PROFILE==='custom'?'Custom':PROFILES[PROFILE].label}`));
  const wl = el('div','wrow');
  Object.entries({cost:'Cost', sla:'SLA', perf:'Performance', scale:'Scalability', cx:'Complexity'}).forEach(([k,label]) => {
    wl.appendChild(el('span','wchip',`${label} <b>${Math.round(weights[k]*100)}%</b>`));
  });
  w.appendChild(wl);

  const best = ranked[0], cheapest = [...ranked].sort((a,b)=>a.monthly-b.monthly)[0];
  let verdict;
  if (best.arch.id === cheapest.arch.id) {
    verdict = `<b>${best.arch.name}</b> apresenta simultaneamente o menor custo estimado (${money(best.monthly,0)}/mês) e o melhor score no perfil selecionado.`;
  } else {
    verdict = `<b>${cheapest.arch.name}</b> tem o menor custo (${money(cheapest.monthly,0)}/mês), mas <b>${best.arch.name}</b> lidera o score por ${
      best.slaStatus==='PASS' && cheapest.slaStatus!=='PASS' ? 'atender ao SLA de '+SLA.slaMaxMinutes+' min' : 'melhor relação tempo de processamento × custo'
    } — diferença de ${money(best.monthly-cheapest.monthly,0)}/mês (${((best.monthly/cheapest.monthly-1)*100).toFixed(0)}%). A decisão depende de o requisito de SLA ser rígido ou negociável.`;
  }
  w.appendChild(el('p','verdict', verdict));
  root.appendChild(w);
  return root;
}

/* ---------- view: OPTIMIZE ---------- */
function viewOptimize(ranked) {
  const root = el('div');
  const r = ranked[0];
  const opts = findOptimizations(inputs(), r.arch, r);
  root.appendChild(el('div','lead',`<h2>Optimization opportunities</h2><p>Avaliadas sobre a arquitetura recomendada (<b>${r.arch.name}</b>), custo atual ${money(r.monthly,0)}/mês.</p>`));

  if (!opts.length) {
    root.appendChild(el('div','card','<p class="note">Nenhuma oportunidade acima de 1% de economia foi identificada com as regras atuais. Ajuste os parâmetros (ex.: mude a ingestão para Full Load ou o formato para JSON) para ver o mecanismo em ação.</p>'));
    return root;
  }

  const totalSave = opts.reduce((a,o)=>a+o.saving,0);
  root.appendChild(el('div','savebox',
    `<span>Economia potencial identificada</span><b>${money(totalSave,0)}/mês</b><em>≈ ${money(totalSave*12,0)}/ano (as otimizações não são necessariamente cumulativas)</em>`));

  opts.forEach(o => {
    const c = el('div','card opt');
    c.appendChild(el('h3',null,`💡 ${o.title}`));
    c.appendChild(el('p','why',o.why));
    const g = el('div','optgrid');
    g.appendChild(miniStat('Current', money(r.monthly,0)));
    g.appendChild(miniStat('After', money(o.newMonthly,0)));
    g.appendChild(miniStat('Monthly saving', money(o.saving,0), 'pos'));
    g.appendChild(miniStat('Reduction', o.savingPct.toFixed(1)+'%', 'pos'));
    g.appendChild(miniStat('SLA', `${o.slaBefore} → ${o.slaAfter}`, o.slaAfter==='PASS'?'pos':o.slaAfter==='FAIL'?'neg':''));
    c.appendChild(g);
    c.appendChild(el('p','note','Estimativa, não garantia: o ganho real depende do comportamento efetivo do workload.'));
    root.appendChild(c);
  });
  return root;
}
function miniStat(l,v,cls='') {
  const d = el('div','ms '+cls);
  d.appendChild(el('span','ms-l',l)); d.appendChild(el('span','ms-v',v));
  return d;
}

/* ---------- view: SENSITIVITY ---------- */
function viewSensitivity() {
  const root = el('div');
  root.appendChild(el('div','lead','<h2>Sensitivity &amp; break-even</h2><p>Como o custo de cada arquitetura reage ao crescimento do volume, e em que ponto a liderança muda.</p>'));

  const rows = sensitivity(inputs(), SELECTED);
  const c = el('div','card');
  c.appendChild(el('h3',null,'Monthly cost vs. processed volume'));
  c.appendChild(lineChart(rows, SELECTED));
  const leg = el('div','legend');
  SELECTED.forEach((id,idx) => leg.appendChild(el('span','lg',`<i style="background:${SERIES[idx%SERIES.length]}"></i>${id} · ${ARCHITECTURES[id].name}`)));
  c.appendChild(leg);
  root.appendChild(c);

  const t = el('table','cmp');
  const h = el('tr'); h.appendChild(el('th',null,'Volume'));
  h.appendChild(el('th','r','TB/month'));
  SELECTED.forEach(id => h.appendChild(el('th','r',id)));
  t.appendChild(h);
  rows.forEach(row => {
    const tr = el('tr');
    tr.appendChild(el('td',null, row.multiplier===1 ? '<b>current (1×)</b>' : row.multiplier+'×'));
    tr.appendChild(el('td','r', num(row.tb,2)));
    const best = Math.min(...SELECTED.map(id=>row.costs[id]));
    SELECTED.forEach(id => tr.appendChild(el('td','r'+(row.costs[id]===best?' strong':''), money(row.costs[id],0))));
    t.appendChild(tr);
  });
  const c2 = el('div','card'); c2.appendChild(el('h3',null,'Sensitivity table')); c2.appendChild(t);
  root.appendChild(c2);

  const cross = breakEven(inputs(), SELECTED);
  const c3 = el('div','card'); c3.appendChild(el('h3',null,'Break-even points'));
  if (!cross.length) {
    c3.appendChild(el('p','note','Nenhuma inversão de liderança entre 0,1× e 30× do volume atual: a arquitetura mais barata hoje permanece a mais barata em toda a faixa analisada.'));
  } else {
    cross.forEach(x => c3.appendChild(el('p','be',
      `Acima de <b>${num(x.tb,2)} TB/mês</b> (${num(x.multiplier,2)}× o volume atual), <b>${ARCHITECTURES[x.to].name}</b> passa a ser mais barata que <b>${ARCHITECTURES[x.from].name}</b>.`)));
  }
  root.appendChild(c3);
  return root;
}

function lineChart(rows, ids) {
  const W=760, H=300, P={l:66,r:16,t:16,b:38};
  const xs = rows.map(r=>Math.log10(r.tb||0.001));
  const allC = rows.flatMap(r => ids.map(id=>r.costs[id]));
  const minX=Math.min(...xs), maxX=Math.max(...xs);
  const maxY=Math.max(...allC)*1.08, minY=0;
  const px = v => P.l + (v-minX)/(maxX-minX||1)*(W-P.l-P.r);
  const py = v => H-P.b - (v-minY)/(maxY-minY||1)*(H-P.t-P.b);

  let g = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Custo mensal por volume processado">`;
  // grid
  for (let k=0;k<=4;k++){
    const v = maxY*k/4, y=py(v);
    g += `<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" class="grid"/>`;
    g += `<text x="${P.l-8}" y="${y+4}" class="ax r">${sym()}${Math.round(fx(v)).toLocaleString('en-US')}</text>`;
  }
  rows.forEach((r,idx)=>{
    const x=px(xs[idx]);
    g += `<text x="${x}" y="${H-14}" class="ax c">${num(r.tb,r.tb<1?2:0)} TB</text>`;
  });
  ids.forEach((id,si)=>{
    const pts = rows.map((r,idx)=>`${px(xs[idx])},${py(r.costs[id])}`).join(' ');
    g += `<polyline points="${pts}" fill="none" stroke="${SERIES[si%SERIES.length]}" stroke-width="2.5" stroke-linejoin="round"/>`;
    rows.forEach((r,idx)=>{ g += `<circle cx="${px(xs[idx])}" cy="${py(r.costs[id])}" r="3.5" fill="${SERIES[si%SERIES.length]}"/>`; });
  });
  g += `</svg>`;
  const wrap = el('div','chartwrap'); wrap.innerHTML = g; return wrap;
}

/* ---------- view: ASSUMPTIONS ---------- */
function viewAssumptions(ranked) {
  const r = ranked[0];
  const root = el('div');
  root.appendChild(el('div','lead','<h2>Assumptions, pricing &amp; limitations</h2><p>Toda estimativa registra as premissas e a versão de preço usada — requisito de reprodutibilidade do TCC.</p>'));

  const a = el('div','card'); a.appendChild(el('h3',null,`Premissas aplicadas — ${r.arch.name}`));
  const ul = el('ul','list'); r.assumptions.forEach(t => ul.appendChild(el('li',null,t)));
  a.appendChild(ul); root.appendChild(a);

  const p = el('div','card'); p.appendChild(el('h3',null,'Pricing database (preço de lista)'));
  const t = el('table','cmp');
  t.appendChild(el('tr',null,'<th>Provider</th><th>Service</th><th>SKU</th><th>Metric</th><th>Unit</th><th class="r">Price (USD)</th><th>Valid from</th><th>Source</th>'));
  PRICING.forEach(x => {
    const tr = el('tr');
    tr.innerHTML = `<td>${x.provider}</td><td>${x.service}</td><td><code>${x.sku}</code></td><td>${x.metric}</td><td>${x.unit}</td><td class="r">${x.price}</td><td>${x.valid_from}</td><td class="src">${x.source}</td>`;
    t.appendChild(tr);
  });
  p.appendChild(t);
  p.appendChild(el('p','note',`Moeda de referência: USD. Conversão para ${CURRENCY} é camada de apresentação (taxa fixa ${FX[CURRENCY]}), não parte do modelo de preço.`));
  root.appendChild(p);

  const l = el('div','card'); l.appendChild(el('h3',null,'Limitações declaradas'));
  const ll = el('ul','list');
  [ 'Preço de lista, sem Savings Plans, Reserved Capacity ou acordos empresariais.',
    'Região única (us-east-1 / aws-us-east-1); preços variam por região.',
    'Tempo de processamento é estimado por throughput teórico, não medido.',
    'Concorrência, skew de dados e fila de execução não são modelados.',
    'Custos indiretos (orquestração, observabilidade, governança, licenças) fora do escopo do MVP.',
    'Serviços com regras de cobrança compostas são simplificados (ex.: Snowflake cloud services layer).',
    'A ferramenta não substitui as calculadoras oficiais dos provedores nem representa uma fatura real.',
  ].forEach(x => ll.appendChild(el('li',null,x)));
  l.appendChild(ll); root.appendChild(l);

  const s = el('div','card'); s.appendChild(el('h3',null,'Confidence score'));
  s.appendChild(el('p',null,`Score atual: <b>${r.confidence}%</b> — faixa de estimativa ${money(r.range.low,0)} a ${money(r.range.high,0)}.`));
  s.appendChild(el('p','note','Composição: base de 55 pontos, +3 por parâmetro avançado informado, +8 quando o runtime é medido em vez de estimado, penalidades para autoscaling e alta taxa de falha. Limite máximo de 92%.'));
  root.appendChild(s);
  return root;
}

/* ---------- boot ---------- */
function boot() {
  $('#profile').onchange = e => { PROFILE = e.target.value; render(false); };
  $('#currency').onchange = e => { CURRENCY = e.target.value; render(false); };
  $('#advToggle').onchange = e => { SHOW_ADVANCED = e.target.checked; render(); };
  $('#reset').onclick = () => { STATE = structuredClone(INPUT_DEFAULTS); SLA={slaMaxMinutes:30,freshnessHours:2}; render(); };
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => { TAB=t.dataset.tab; render(false); });
  render();
}
document.addEventListener('DOMContentLoaded', boot);
