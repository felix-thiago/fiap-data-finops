name: Deploy DataCost Architect to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "calculator/index.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload calculator/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: calculator
      - id: deployment
        uses: actions/deploy-pages@v4
